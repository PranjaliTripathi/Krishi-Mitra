<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-t="schemes_title">Krishi Mitra - Scheme Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --primary-green: #1a531b; --secondary-green: #2e7d32; }
        body { background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { height: 100vh; background: var(--primary-green); color: white; position: fixed; width: 250px; transition: all 0.3s; z-index: 1000; }
        .sidebar a { color: #cfdfcf; text-decoration: none; padding: 12px 20px; display: block; transition: 0.2s; border-radius: 8px; margin: 4px 10px; }
        .sidebar a:hover, .sidebar a.active { background: var(--secondary-green); color: white; }
        .sidebar .bottom-links { position: absolute; bottom: 20px; width: 100%; }
        .main-content { margin-left: 250px; padding: 20px; transition: all 0.3s; }
        .mobile-nav { display: none; background: var(--primary-green); color: white; padding: 10px 20px; position: sticky; top: 0; z-index: 1001; }
        
        .detail-card { border: none; border-radius: 20px; overflow: hidden; }
        .section-title { border-left: 4px solid var(--primary-green); padding-left: 15px; margin-bottom: 20px; font-weight: bold; }
        .info-box { background: #f8f9fa; border-radius: 12px; padding: 15px; height: 100%; }
        .detail-row { border-bottom: 1px solid #e9ecef; padding-bottom: 15px; margin-bottom: 15px; }
        .detail-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }

        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); width: 250px; }
            .sidebar.active { transform: translateX(0); }
            .main-content { margin-left: 0; }
            .mobile-nav { display: flex; justify-content: space-between; align-items: center; }
            .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; }
            .overlay.active { display: block; }
        }
    </style>
</head>
<body>

<div class="overlay" id="overlay"></div>

<div class="mobile-nav">
    <h4 class="mb-0"><i class="bi bi-leaf"></i> Krishi Mitra</h4>
    <button class="btn text-white fs-3 p-0" id="menuToggle"><i class="bi bi-list"></i></button>
</div>

<div class="sidebar" id="sidebar">
    <div class="p-4 text-center">
        <h3 class="fw-bold"><i class="bi bi-leaf"></i> <span data-t="brand">Krishi Mitra</span></h3>
    </div>
    <nav>
        <a href="farmer_dashboard.html"><i class="bi bi-speedometer2 me-2"></i> <span data-t="dashboard">Dashboard</span></a>
        <a href="weather.html"><i class="bi bi-cloud-sun me-2"></i> <span data-t="weather_nav">Weather</span></a>
        <a href="my_crops.html"><i class="bi bi-tree me-2"></i> <span data-t="my_crops_nav">My Crops</span></a>
        <a href="all_crops_info.html"><i class="bi bi-journal-text me-2"></i> <span data-t="all_crops_info_nav">Smart Crop Information</span></a>
        <a href="schemes.html" class="active"><i class="bi bi-award me-2"></i> <span data-t="schemes_nav">Schemes</span></a>
        <a href="market_prices.html"><i class="bi bi-graph-up-arrow me-2"></i> <span data-t="market_prices_nav">Market Price</span></a>
        <a href="notifications.html"><i class="bi bi-bell me-2"></i> <span data-t="notifications_nav">Notifications</span></a>
        <a href="queries.html"><i class="bi bi-question-circle me-2"></i> <span data-t="my_queries">My Questions</span></a>
        
        <div class="bottom-links">
            <a href="profile.html"><i class="bi bi-person-circle me-2"></i> <span data-t="profile_nav">Profile</span></a>
            <a href="#" id="logoutBtn" class="text-danger"><i class="bi bi-box-arrow-right me-2"></i> <span data-t="logout">Logout</span></a>
        </div>
    </nav>
</div>

<div class="main-content">
    <div class="container">
        <div class="mb-4">
            <a href="schemes.html" class="btn btn-light rounded-pill px-3 shadow-sm">
                <i class="bi bi-arrow-left me-2"></i> <span data-t="back_btn">Back</span>
            </a>
        </div>

        <div id="schemeDetailContent">
            <!-- Content will be loaded here -->
        </div>
    </div>
</div>

<script src="translations.js"></script>
<script>
    const user = JSON.parse(localStorage.getItem('user'));
    if (!user || user.role !== 'farmer') window.location.href = 'login.html';

    const urlParams = new URLSearchParams(window.location.search);
    const schemeId = parseInt(urlParams.get('id'));

    function renderDetails() {
        const lang = localStorage.getItem('krishi_mitra_lang') || 'en';
        const t = translations[lang] || translations['en'];

        const schemes = JSON.parse(localStorage.getItem('schemes_data')) || [];
        const scheme = schemes.find(s => s.id === schemeId);

        const contentDiv = document.getElementById('schemeDetailContent');

        if (!scheme) {
            contentDiv.innerHTML = `
                <div class="card detail-card shadow-sm p-5 text-center">
                    <i class="bi bi-exclamation-circle text-danger fs-1 mb-3"></i>
                    <h4 class="text-muted">Scheme Not Found</h4>
                    <p>The scheme you are looking for does not exist or has been removed.</p>
                    <a href="schemes.html" class="btn btn-success mt-3">Back to Schemes</a>
                </div>
            `;
            return;
        }

        contentDiv.innerHTML = `
            <div class="card detail-card shadow-sm mb-4">
                <div class="card-body p-4 p-md-5">
                    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
                        <span class="badge ${scheme.type === 'Govt' || scheme.type === 'Central' ? 'bg-success' : 'bg-info'} fs-6 py-2 px-3 mb-2 rounded-pill shadow-sm">
                            <i class="bi bi-building me-1"></i> ${scheme.type} - ${scheme.state}
                        </span>
                    </div>

                    <h1 class="fw-bold mb-3 text-dark display-6">${lang === 'hi' ? (scheme.name_hi || scheme.name_en || scheme.name || '') : (scheme.name_en || scheme.name_hi || scheme.name || '')}</h1>
                    <h5 class="text-success fw-bold mb-4"><i class="bi bi-tree me-1"></i> <span data-t="crop">${t.crop || 'Crop'}</span>: ${lang === 'hi' ? (scheme.cropName_hi || scheme.cropName_en || scheme.cropName || '') : (scheme.cropName_en || scheme.cropName_hi || scheme.cropName || '')}</h5>

                    <p class="lead text-secondary mb-5">${lang === 'hi' ? (scheme.shortDesc_hi || scheme.shortDesc_en || scheme.shortDesc || '') : (scheme.shortDesc_en || scheme.shortDesc_hi || scheme.shortDesc || '')}</p>

                    <!-- Overview Summary -->
                    <div class="row g-4 mb-5">
                        <div class="col-md-3">
                            <div class="info-box border-success border text-center shadow-sm h-100">
                                <h6 class="text-muted mb-2 fw-bold" data-t="subsidy_percent">${t.subsidy_percent || 'Subsidy %'}</h6>
                                <p class="mb-0 fs-5 text-success fw-bold">${scheme.subsidyPercent || (lang === 'hi' ? 'अनुपलब्ध' : 'N/A')}</p>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="info-box border-warning border text-center shadow-sm h-100">
                                <h6 class="text-muted mb-2 fw-bold" data-t="area_limit">${t.area_limit || 'Area Limit'}</h6>
                                <p class="mb-0 fs-5 text-warning fw-bold">${scheme.areaLimit || (lang === 'hi' ? 'कोई सीमा नहीं' : 'No limit')}</p>
                            </div>
                        </div>
                         <div class="col-md-3">
                            <div class="info-box border-primary border text-center shadow-sm h-100">
                                <h6 class="text-muted mb-2 fw-bold" data-t="max_usage">${t.max_usage || 'Max Usage'}</h6>
                                <p class="mb-0 fs-5 text-primary fw-bold">${scheme.maxUsage || (lang === 'hi' ? 'अनुपलब्ध' : 'N/A')}</p>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="info-box border-info border text-center shadow-sm h-100">
                                <h6 class="text-muted mb-2 fw-bold" data-t="farmer_cont">${t.farmer_cont || 'Farmer Contribution'}</h6>
                                <p class="mb-0 fs-5 text-info fw-bold">${scheme.farmerCont || (lang === 'hi' ? 'अनुपलब्ध' : 'N/A')}</p>
                            </div>
                        </div>
                    </div>

                    <div class="row g-5">
                        <div class="col-lg-8">
                            <!-- Details Section -->
                            <div class="mb-5">
                                <h4 class="section-title text-dark" data-t="eligibility">${t.eligibility || 'Eligibility'}</h4>
                                <div class="bg-light p-4 rounded-4 shadow-sm">
                                    <p class="mb-0 text-muted" style="white-space: pre-wrap;">${lang === 'hi' ? (scheme.eligibility_hi || scheme.eligibility_en || scheme.eligibility || '') : (scheme.eligibility_en || scheme.eligibility_hi || scheme.eligibility || '')}</p>
                                </div>
                            </div>

                            <div class="mb-5">
                                <h4 class="section-title text-dark" data-t="benefits">${t.benefits || 'Benefits'}</h4>
                                <div class="bg-success bg-opacity-10 p-4 rounded-4 shadow-sm border border-success border-opacity-25">
                                    <p class="mb-0 text-success fw-semibold" style="white-space: pre-wrap;">${lang === 'hi' ? (scheme.benefits_hi || scheme.benefits_en || scheme.benefits || '') : (scheme.benefits_en || scheme.benefits_hi || scheme.benefits || '')}</p>
                                </div>
                            </div>

                            <div class="mb-5">
                                <h4 class="section-title text-dark" data-t="application_process">${t.application_process || 'Application Process'}</h4>
                                <div class="bg-light p-4 rounded-4 shadow-sm">
                                    <p class="mb-0 text-muted" style="white-space: pre-wrap;">${lang === 'hi' ? (scheme.process_hi || scheme.process_en || scheme.process || '') : (scheme.process_en || scheme.process_hi || scheme.process || '')}</p>
                                </div>
                            </div>
                            
                            <div class="mb-5">
                                <h4 class="section-title text-dark" data-t="terms">${t.terms || 'Terms & Conditions'}</h4>
                                <div class="bg-light p-4 rounded-4 shadow-sm">
                                    <p class="mb-0 text-muted small" style="white-space: pre-wrap;">${lang === 'hi' ? (scheme.terms_hi || scheme.terms_en || scheme.terms || '') : (scheme.terms_en || scheme.terms_hi || scheme.terms || '')}</p>
                                </div>
                            </div>
                        </div>

                        <div class="col-lg-4">
                            <!-- Sidebar Details -->
                            <div class="card border-0 shadow-sm bg-primary bg-opacity-10 rounded-4 mb-4">
                                <div class="card-body p-4">
                                    <h5 class="fw-bold text-primary mb-4 border-bottom border-primary pb-2" data-t="required_docs">${t.required_docs || 'Required Documents'}</h5>
                                    <ul class="list-unstyled mb-0 text-muted" style="white-space: pre-wrap;">
                                        ${(lang === 'hi' ? (scheme.docs_hi || scheme.docs_en || scheme.docs || '') : (scheme.docs_en || scheme.docs_hi || scheme.docs || '')).split(',').map(d => `<li class="mb-2"><i class="bi bi-check-circle-fill text-primary me-2"></i>${d.trim()}</li>`).join('')}
                                    </ul>
                                </div>
                            </div>

                            <div class="card border-0 shadow-sm bg-light rounded-4">
                                <div class="card-body p-4">
                                     <h5 class="fw-bold mb-4 border-bottom pb-2" data-t="financial_breakdown">${t.financial_breakdown || 'Financial Breakdown'}</h5>
                                    
                                     <div class="detail-row">
                                        <p class="text-muted small mb-1 fw-bold" data-t="govt_cont">${t.govt_cont || 'Govt Contribution'}</p>
                                        <p class="mb-0 fw-semibold text-dark">${scheme.govtCont || 'N/A'}</p>
                                    </div>
                                    <div class="detail-row">
                                        <p class="text-muted small mb-1 fw-bold" data-t="farmer_cont">${t.farmer_cont || 'Farmer Contribution'}</p>
                                        <p class="mb-0 fw-semibold text-dark">${scheme.farmerCont || 'N/A'}</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `;
    }

    // Sidebar Toggle
    const menuToggle = document.getElementById('menuToggle');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');

    menuToggle.addEventListener('click', () => {
        sidebar.classList.add('active');
        overlay.classList.add('active');
    });

    overlay.addEventListener('click', () => {
        sidebar.classList.remove('active');
        overlay.classList.remove('active');
    });

    document.getElementById('logoutBtn').addEventListener('click', (e) => {
        e.preventDefault();
        const lang = localStorage.getItem('krishi_mitra_lang') || 'en';
        Swal.fire({
            title: translations[lang].logout_confirm_title || "Are you sure?",
            text: translations[lang].logout_confirm || "Do you really want to logout?",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#1a531b',
            cancelButtonColor: '#d33',
            confirmButtonText: lang === 'hi' ? 'हाँ, लॉगआउट करें' : 'Yes, logout'
        }).then((result) => {
            if (result.isConfirmed) {
                localStorage.removeItem('user');
                window.location.href = 'index.html#top';
            }
        });
    });

    function setLanguage(lang) {
        localStorage.setItem('krishi_mitra_lang', lang);
        renderDetails();
    }

    renderDetails();
    
    // Real-time sync listener
    window.addEventListener('storage', (event) => {
        if (event.key === 'yojana_data') {
            renderDetails();
        }
    });

</script>
</body>
</html>
