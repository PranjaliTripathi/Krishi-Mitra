<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-t="notifications_nav">Krishi Mitra - Notifications</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --primary-green: #1a531b; --secondary-green: #2e7d32; }
        body { background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* Sidebar Styles */
        .sidebar { height: 100vh; background: var(--primary-green); color: white; position: fixed; width: 250px; z-index: 1000; left: 0; top: 0; overflow-y: auto; transition: all 0.3s ease; }
        .sidebar.hidden { left: -250px; }
        .sidebar a { color: #cfdfcf; text-decoration: none; padding: 12px 20px; display: block; transition: 0.2s; border-radius: 8px; margin: 4px 10px; }
        .sidebar a:hover, .sidebar a.active { background: var(--secondary-green); color: white; }
        .sidebar .bottom-links { position: absolute; bottom: 20px; width: 100%; box-sizing: border-box; }
        
        /* Main Content */
        .main-content { margin-left: 250px; padding: 20px; transition: all 0.3s ease; }
        .main-content.expanded { margin-left: 0; }
        
        /* Navbar */
        .mobile-nav { display: flex; background: var(--primary-green); color: white; padding: 10px 20px; position: sticky; top: 0; z-index: 1001; justify-content: space-between; align-items: center; }
        
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; }
        .overlay.active { display: block; }
    </style>
</head>
<body>

<div class="overlay" id="overlay"></div>

<div class="mobile-nav">
    <div class="d-flex align-items-center gap-3">
        <button class="btn text-white fs-3 p-0" id="menuToggle"><i class="bi bi-list"></i></button>
        <h4 class="mb-0"><i class="bi bi-leaf"></i> Krishi Mitra</h4>
    </div>
</div>

<div class="sidebar" id="sidebar">
    <div class="p-4 text-center">
        <h3 class="fw-bold"><i class="bi bi-leaf"></i> <span data-t="brand">Krishi Mitra</span></h3>
    </div>
    <nav>
        <a href="farmer_dashboard.html">📊 <span data-t="dashboard" class="ms-2">Dashboard</span></a>
        <a href="weather.html">🌦️ <span data-t="weather_nav" class="ms-2">Weather</span></a>
        <a href="my_crops.html">🌾 <span data-t="my_crops_nav" class="ms-2">My Crops</span></a>
        <a href="all_crops_info.html">📜 <span data-t="all_crops_info_nav" class="ms-2">Smart Crop Information</span></a>
        <a href="schemes.html">🏛️ <span data-t="schemes_nav" class="ms-2">Schemes</span></a>
        <a href="market_prices.html">📈 <span data-t="market_prices_nav" class="ms-2">Market Price</span></a>
        <a href="notifications.html" class="active">🔔 <span data-t="notifications_nav" class="ms-2">Notifications</span></a>
        <a href="queries.html">❓ <span data-t="my_queries" class="ms-2">My Questions</span></a>
        
        <div class="bottom-links">
            <a href="profile.html">👥 <span data-t="profile_nav" class="ms-2">Profile</span></a>
            <a href="#" id="logoutBtn" class="text-danger">🚪 <span data-t="logout" class="ms-2">Logout</span></a>
        </div>
    </nav>
</div>

<div class="main-content">
    <div class="container">
        <h2 class="mb-4 fw-bold" data-t="notifications_nav">Notifications</h2>

        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="list-group list-group-flush" id="notifList">
                <!-- Notifications loaded via JS -->
            </div>
        </div>
    </div>
</div>

<script src="translations.js"></script>
<script>
    // Sidebar Toggle
    const menuToggle = document.getElementById('menuToggle');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');

    menuToggle.addEventListener('click', () => {
        sidebar.classList.add('active');
        overlay.classList.add('active');
    });

    overlay.addEventListener('click', () => {
        sidebar.classList.remove('active');
        overlay.classList.remove('active');
    });

    function loadNotifications() {
        const lang = localStorage.getItem('krishi_mitra_lang') || 'en';
        const t = translations[lang];
        const now = new Date();

        // Helper to format/validate
        const isActive = (n) => {
            if (n.status === 'Inactive') return false;
            if (n.expiry_date && n.expiry_time) {
                const expiry = new Date(`${n.expiry_date}T${n.expiry_time}`);
                if (now > expiry) return false;
            }
            return true;
        }

        const adminNotifs = JSON.parse(localStorage.getItem('notifications') || '[]')
            .filter(isActive)
            .map(n => ({
                icon: 'bi-info-circle',
                color: 'primary',
                title: n.title,
                time: `${n.date} ${n.time}`,
                text: n.text
            }));

        const adminAlerts = JSON.parse(localStorage.getItem('alerts') || '[]')
            .filter(isActive)
            .map(a => ({
                icon: 'bi-exclamation-triangle',
                color: a.severity === 'Critical' ? 'danger' : (a.severity === 'Warning' ? 'warning' : 'warning'),
                title: a.title,
                time: `${a.date} ${a.time}`,
                text: a.text
            }));

        const notifs = [...adminAlerts, ...adminNotifs];

        const list = document.getElementById('notifList');
        if (!list) return;
        if (notifs.length === 0) {
            list.innerHTML = `<div class="p-4 text-center text-muted" data-t="no_notifications">${t.no_notifications || (lang === 'hi' ? 'कोई सक्रिय सूचना नहीं है' : 'No active notifications')}</div>`;
            return;
        }
        
        list.innerHTML = notifs.map(n => `
            <div class="list-group-item p-3 notif-card">
                <div class="d-flex align-items-center">
                    <div class="notif-icon bg-${n.color} bg-opacity-10 text-${n.color} me-3">
                        <i class="bi ${n.icon}"></i>
                    </div>
                    <div class="flex-grow-1">
                        <div class="d-flex justify-content-between align-items-center">
                            <h6 class="mb-1 fw-bold">${n.title}</h6>
                            <small class="text-muted">${n.time}</small>
                        </div>
                        <p class="mb-0 text-muted small">${n.text}</p>
                    </div>
                </div>
            </div>
        `).join('');
    }

    // Sidebar Toggle
    const menuToggleBtn = document.getElementById('menuToggle'); // Avoid name collision
    const sidebarElement = document.getElementById('sidebar');
    const mainContentArea = document.querySelector('.main-content');
    const overlayElement = document.getElementById('overlay');

    menuToggleBtn.addEventListener('click', (e) => {
        sidebarElement.classList.toggle('active');
        mainContentArea.classList.toggle('active');
        overlayElement.classList.toggle('active');
    });

    overlayElement.addEventListener('click', () => {
        sidebarElement.classList.remove('active');
        mainContentArea.classList.remove('active');
        overlayElement.classList.remove('active');
    });

    // Storage listener for real-time sync
    window.addEventListener('storage', (event) => {
        if (event.key === 'notifications' || event.key === 'alerts') {
            loadNotifications();
        }
    });

    loadNotifications();

    // Logout with Confirmation
    document.getElementById('logoutBtn').addEventListener('click', () => {
        const lang = localStorage.getItem('krishi_mitra_lang') || 'en';
        const t = translations[lang];
        Swal.fire({
            title: t.logout_confirm_title,
            text: t.logout_confirm,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#28a745',
            cancelButtonColor: '#d33',
            confirmButtonText: t.logout
        }).then((result) => {
            if (result.isConfirmed) {
                localStorage.removeItem('user');
                window.location.href = 'index.html#top';
            }
        });
    });

    loadNotifications();

    // Listen for language changes
    window.addEventListener('storage', (e) => {
        if (e.key === 'krishi_mitra_lang') {
            loadNotifications();
        }
    });
</script>
</body>
</html>
