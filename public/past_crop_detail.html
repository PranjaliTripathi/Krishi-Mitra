<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-t="crop_details_title">Krishi Mitra - Crop Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --primary-green: #1a531b; --secondary-green: #2e7d32; }
        body { background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { height: 100vh; background: var(--primary-green); color: white; position: fixed; width: 250px; transition: all 0.3s; z-index: 1000; }
        .sidebar a { color: #cfdfcf; text-decoration: none; padding: 12px 20px; display: block; transition: 0.2s; border-radius: 8px; margin: 4px 10px; }
        .sidebar a:hover, .sidebar a.active { background: var(--secondary-green); color: white; }
        .sidebar .bottom-links { position: absolute; bottom: 20px; width: 100%; }
        .main-content { margin-left: 250px; padding: 20px; transition: all 0.3s; }
        .mobile-nav { display: none; background: var(--primary-green); color: white; padding: 10px 20px; position: sticky; top: 0; z-index: 1001; }
        .detail-card { border: none; border-radius: 15px; overflow: hidden; }
        .section-header { border-left: 4px solid var(--secondary-green); padding-left: 15px; margin-bottom: 20px; }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); width: 250px; }
            .sidebar.active { transform: translateX(0); }
            .main-content { margin-left: 0; }
            .mobile-nav { display: flex; justify-content: space-between; align-items: center; }
            .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; }
            .overlay.active { display: block; }
        }
    </style>
</head>
<body>

<div class="overlay" id="overlay"></div>

<div class="mobile-nav">
    <h4 class="mb-0"><i class="bi bi-leaf"></i> Krishi Mitra</h4>
    <button class="btn text-white fs-3 p-0" id="menuToggle"><i class="bi bi-list"></i></button>
</div>

<div class="sidebar" id="sidebar">
    <div class="p-4 text-center">
        <h3 class="fw-bold"><i class="bi bi-leaf"></i> <span data-t="brand">Krishi Mitra</span></h3>
    </div>
    <nav>
        <a href="farmer_dashboard.html"><i class="bi bi-speedometer2 me-2"></i> <span data-t="dashboard">Dashboard</span></a>
        <a href="weather.html"><i class="bi bi-cloud-sun me-2"></i> <span data-t="weather_nav">Weather</span></a>
        <a href="my_crops.html" class="active"><i class="bi bi-tree me-2"></i> <span data-t="my_crops_nav">My Crops</span></a>
        <a href="all_crops_info.html"><i class="bi bi-journal-text me-2"></i> <span data-t="all_crops_info_nav">Smart Crop Information</span></a>
        <a href="schemes.html"><i class="bi bi-award me-2"></i> <span data-t="schemes_nav">Schemes</span></a>
        <a href="market_prices.html"><i class="bi bi-graph-up-arrow me-2"></i> <span data-t="market_prices_nav">Market Price</span></a>
        <a href="notifications.html"><i class="bi bi-bell me-2"></i> <span data-t="notifications_nav">Notifications</span></a>
        <a href="queries.html"><i class="bi bi-question-circle me-2"></i> <span data-t="my_queries">My Questions</span></a>
        
        <div class="bottom-links">
            <a href="profile.html"><i class="bi bi-person-circle me-2"></i> <span data-t="profile_nav">Profile</span></a>
            <a href="#" id="logoutBtn" class="text-danger"><i class="bi bi-box-arrow-right me-2"></i> <span data-t="logout">Logout</span></a>
        </div>
    </nav>
</div>

<div class="main-content">
    <div class="container">
        <div class="d-flex align-items-center mb-4">
            <a href="my_crops.html" class="btn btn-outline-success rounded-circle me-3"><i class="bi bi-arrow-left"></i></a>
            <h2 class="fw-bold mb-0" data-t="crop_details_title">Crop Detailed Report</h2>
        </div>

        <div id="cropDetailContent">
            <!-- Details will be loaded here -->
        </div>
    </div>
</div>

<script src="translations.js"></script>
<script src="crops_data.js"></script>
<script>
    // Sidebar Toggle
    const menuToggle = document.getElementById('menuToggle');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');

    menuToggle.addEventListener('click', () => {
        sidebar.classList.add('active');
        overlay.classList.add('active');
    });

    overlay.addEventListener('click', () => {
        sidebar.classList.remove('active');
        overlay.classList.remove('active');
    });

    const user = JSON.parse(localStorage.getItem('user'));
    if (!user || user.role !== 'farmer') window.location.href = 'login.html';

    const urlParams = new URLSearchParams(window.location.search);
    const cropId = parseInt(urlParams.get('id'));

    function loadCropDetail() {
        const crops = JSON.parse(localStorage.getItem('pastCrops') || '[]');
        const crop = crops.find(c => c.id === cropId);
        const lang = localStorage.getItem('krishi_mitra_lang') || 'en';
        const t = translations[lang];

        if (!crop) {
            document.getElementById('cropDetailContent').innerHTML = '<div class="alert alert-danger">Crop not found!</div>';
            return;
        }

        const cropData = cropsData.find(cd => cd.name_en === crop.name) || {};
        const content = document.getElementById('cropDetailContent');

        content.innerHTML = `
            <div class="card detail-card shadow-sm p-4 mb-4">
                <div class="row">
                    <div class="col-md-12">
                        <div class="section-header">
                            <h4 class="fw-bold text-success" data-t="basic_info">${t.basic_info}</h4>
                        </div>
                        <div class="row g-3">
                            <div class="col-md-4">
                                <small class="text-muted d-block" data-t="my_crops">${t.my_crops}</small>
                                <span class="fs-5 fw-bold">${lang === 'hi' ? (cropData.name_hi || crop.name) : crop.name}</span>
                            </div>
                            <div class="col-md-4">
                                <small class="text-muted d-block" data-t="season">${t.season}</small>
                                <span class="fs-5 fw-bold">${cropData.season || 'N/A'}</span>
                            </div>
                            <div class="col-md-4">
                                <small class="text-muted d-block" data-t="suitable_soil">${t.suitable_soil}</small>
                                <span class="fs-5 fw-bold">${cropData.suitable_soil || 'N/A'}</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card detail-card shadow-sm p-4 mb-4">
                <div class="section-header">
                    <h4 class="fw-bold text-success" data-t="input_details">${t.input_details}</h4>
                </div>
                <div class="row g-4">
                    <div class="col-md-4">
                        <small class="text-muted d-block" data-t="fertilizers">${t.fertilizers}</small>
                        <span class="fw-bold">${crop.fertilizer}</span>
                    </div>
                    <div class="col-md-4">
                        <small class="text-muted d-block" data-t="pesticides">${t.pesticides}</small>
                        <span class="fw-bold">${crop.pesticide}</span>
                    </div>
                    <div class="col-md-4">
                        <small class="text-muted d-block" data-t="application_frequency">${t.application_frequency}</small>
                        <span class="fw-bold">${crop.app_frequency || 'N/A'}</span>
                    </div>
                    <div class="col-md-4">
                        <small class="text-muted d-block" data-t="quantity_per_acre">${t.quantity_per_acre}</small>
                        <span class="fw-bold">${crop.qty_per_acre || 'N/A'}</span>
                    </div>
                    <div class="col-md-4">
                        <small class="text-muted d-block" data-t="land_area">${t.land_area}</small>
                        <span class="fw-bold">${crop.land_area || 'N/A'} Acres</span>
                    </div>
                </div>
            </div>

            <div class="card detail-card shadow-sm p-4 mb-4">
                <div class="section-header">
                    <h4 class="fw-bold text-success" data-t="cost_breakdown">${t.cost_breakdown}</h4>
                </div>
                <div class="row g-4">
                    <div class="col-md-2">
                        <small class="text-muted d-block" data-t="seed_cost">${t.seed_cost}</small>
                        <span class="fw-bold">₹ ${crop.cost_seed || 0}</span>
                    </div>
                    <div class="col-md-2">
                        <small class="text-muted d-block" data-t="fertilizer_cost">${t.fertilizer_cost}</small>
                        <span class="fw-bold">₹ ${crop.cost_fert || 0}</span>
                    </div>
                    <div class="col-md-2">
                        <small class="text-muted d-block" data-t="pesticide_cost">${t.pesticide_cost}</small>
                        <span class="fw-bold">₹ ${crop.cost_pest || 0}</span>
                    </div>
                    <div class="col-md-2">
                        <small class="text-muted d-block" data-t="labor_cost">${t.labor_cost}</small>
                        <span class="fw-bold">₹ ${crop.cost_labor || 0}</span>
                    </div>
                    <div class="col-md-2">
                        <small class="text-muted d-block" data-t="irrigation_cost">${t.irrigation_cost}</small>
                        <span class="fw-bold">₹ ${crop.cost_irri || 0}</span>
                    </div>
                    <div class="col-md-2">
                        <small class="text-muted d-block" data-t="total_cost">${t.total_cost}</small>
                        <span class="fw-bold text-danger fs-5">₹ ${crop.total_cost}</span>
                    </div>
                </div>
            </div>

            <div class="card detail-card shadow-sm p-4 mb-4">
                <div class="section-header">
                    <h4 class="fw-bold text-success" data-t="production_details">${t.production_details}</h4>
                </div>
                <div class="row g-4">
                    <div class="col-md-4">
                        <small class="text-muted d-block" data-t="total_production_label">${t.total_production_label}</small>
                        <span class="fw-bold fs-5">${crop.total_production} Quintals</span>
                    </div>
                    <div class="col-md-4">
                        <small class="text-muted d-block" data-t="harvest_time_days">${t.harvest_time_days}</small>
                        <span class="fw-bold fs-5">${crop.duration} Days</span>
                    </div>
                    <div class="col-md-4">
                        <small class="text-muted d-block" data-t="problems_faced">${t.problems_faced}</small>
                        <span class="fw-bold text-warning">${crop.problems || t.no_major_issues}</span>
                    </div>
                </div>
            </div>

            <div class="card detail-card shadow-sm p-4 mb-4">
                <div class="section-header">
                    <h4 class="fw-bold text-success" data-t="market_details">${t.market_details}</h4>
                </div>
                <div class="row g-4">
                    <div class="col-md-3">
                        <small class="text-muted d-block" data-t="market_price_at_time">${t.market_price_at_time}</small>
                        <span class="fw-bold">₹ ${crop.market_price || 'N/A'}</span>
                    </div>
                    <div class="col-md-3">
                        <small class="text-muted d-block" data-t="selling_price">${t.selling_price}</small>
                        <span class="fw-bold">₹ ${crop.selling_price || 'N/A'}</span>
                    </div>
                    <div class="col-md-3">
                        <small class="text-muted d-block" data-t="total_income">${t.total_income}</small>
                        <span class="fw-bold text-primary fs-5">₹ ${crop.total_income || (crop.total_production * (crop.selling_price || 0))}</span>
                    </div>
                    <div class="col-md-3">
                        <small class="text-muted d-block" data-t="final_profit">${t.final_profit}</small>
                        <span class="fw-bold text-success fs-4">₹ ${crop.actual_profit}</span>
                    </div>
                </div>
            </div>
        `;
    }

    // Logout with Confirmation
    document.getElementById('logoutBtn').addEventListener('click', () => {
        const lang = localStorage.getItem('krishi_mitra_lang') || 'en';
        const t = translations[lang];
        Swal.fire({
            title: t.logout_confirm_title,
            text: t.logout_confirm,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#28a745',
            cancelButtonColor: '#d33',
            confirmButtonText: t.logout
        }).then((result) => {
            if (result.isConfirmed) {
                localStorage.removeItem('user');
                window.location.href = 'index.html';
            }
        });
    });

    loadCropDetail();
</script>
</body>
</html>
