<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-t="forgot_password_title">Krishi Mitra - Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #f8f9fa; }
        .forgot-container { max-width: 450px; margin-top: 80px; }
        .card { border: none; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn-success { background-color: #28a745; border: none; }
        .lang-switch { position: absolute; top: 20px; right: 20px; }
        .pass-group { position: relative; }
        .pass-toggle { position: absolute; right: 15px; top: 38px; cursor: pointer; color: #64748b; z-index: 10; }
        .ans-toggle { top: 35px; }
    </style>
</head>
<body>

<div class="lang-switch">
    <button class="btn btn-outline-success btn-sm" onclick="window.toggleLang()">
        <i class="bi bi-translate"></i> <span id="langToggleText">हिंदी</span>
    </button>
</div>

<div class="container forgot-container">
    <div class="text-center mb-4">
        <h2 class="text-success fw-bold"><i class="bi bi-key"></i> <span data-t="forgot_password_title">Forgot Password</span></h2>
        <p class="text-muted" data-t="brand">Recover your Krishi Mitra account</p>
    </div>
    
    <div class="card p-4">
        <!-- Step 1: Enter Email/Mobile -->
        <div id="step1">
            <div class="mb-3">
                <label class="form-label" data-t="email_mobile_label">Enter Email or Mobile</label>
                <input type="text" class="form-control" id="email_mobile" required>
            </div>
            <button class="btn btn-success w-100 mb-3" id="checkUserBtn" data-t="submit">Continue</button>
            <div class="text-center">
                <a href="login.html" class="text-muted small" data-t="back_to_login">Back to Login</a>
            </div>
        </div>

        <!-- Step 2: Choose Method -->
        <div id="step2" style="display: none;">
            <h5 class="mb-3" data-t="forgot_password_title">Choose Recovery Method</h5>
            <div class="d-grid gap-2">
                <button class="btn btn-outline-success" id="methodSecurityBtn">Option A: Security Question</button>
                <button class="btn btn-outline-primary" id="methodAdminBtn">Option B: Request to Admin</button>
            </div>
            <button class="btn btn-link text-muted mt-3 w-100" onclick="location.reload()" data-t="back_to_login">Back</button>
        </div>

        <!-- Step 3A: Security Verification -->
        <div id="step3A" style="display: none;">
            <h5 class="mb-3" data-t="security_question_label">Security Verification</h5>
            <div id="q1_container" class="pass-group">
                <p id="displayQuestion1" class="fw-bold text-muted small mb-1"></p>
                <input type="password" class="form-control mb-3" id="security_answer1" placeholder="Answer 1">
                <i class="bi bi-eye pass-toggle ans-toggle" onclick="togglePass('security_answer1')"></i>
            </div>
            <div id="q2_container" style="display: none;" class="pass-group">
                <hr>
                <p id="displayQuestion2" class="fw-bold text-muted small mb-1"></p>
                <input type="password" class="form-control mb-3" id="security_answer2" placeholder="Answer 2">
                <i class="bi bi-eye pass-toggle ans-toggle" onclick="togglePass('security_answer2')"></i>
            </div>

            <div class="mb-3 mt-4 pass-group">
                <label class="form-label" data-t="password_label">New Password</label>
                <input type="password" class="form-control" id="new_password" required>
                <i class="bi bi-eye pass-toggle" onclick="togglePass('new_password')"></i>
            </div>
            <button class="btn btn-success w-100" id="resetPasswordBtn" data-t="submit">Reset Password</button>
            <button class="btn btn-link text-muted mt-2 w-100" onclick="location.reload()" data-t="back_to_login">Cancel</button>
        </div>

        <!-- Step 3B: Admin Request -->
        <div id="step3B" style="display: none;">
            <div class="text-center py-4">
                <i class="bi bi-clock-history text-primary fs-1"></i>
                <h5 class="mt-3" data-t="reset_request_sent">Request Sent!</h5>
                <p class="text-muted">Your password reset request has been sent to the admin. Please contact the admin or check back later.</p>
                <a href="login.html" class="btn btn-primary mt-3" data-t="back_to_login">Back to Login</a>
            </div>
        </div>
    </div>
</div>

<script src="translations.js"></script>
<script src="password_validator.js"></script>
<script>
        function togglePass(id) {
        const el = document.getElementById(id);
        const icon = el.nextElementSibling;
        if (el.type === 'password') {
            el.type = 'text';
            icon.classList.replace('bi-eye', 'bi-eye-slash');
        } else {
            el.type = 'password';
            icon.classList.replace('bi-eye-slash', 'bi-eye');
        }
    }

    let userEmailMobile = '';

    let targetUser = null;

    document.getElementById('checkUserBtn').addEventListener('click', () => {
        userEmailMobile = document.getElementById('email_mobile').value;
        const lang = localStorage.getItem('krishi_mitra_lang') || 'en';
        const t = translations[lang];

        if (!userEmailMobile) return Swal.fire({ icon: 'warning', text: t.all_fields_required });

        // Unified Storage: Simulated User Check
        const users = JSON.parse(localStorage.getItem('users') || '[]');
        targetUser = users.find(u => u.email_mobile === userEmailMobile);

        if (targetUser) {
            document.getElementById('step1').style.display = 'none';
            document.getElementById('step2').style.display = 'block';
            
            // Setup questions
            document.getElementById('displayQuestion1').innerText = targetUser.security_question || 'What is your pet\'s name?';
            if (targetUser.security_q2) {
                document.getElementById('q2_container').style.display = 'block';
                document.getElementById('displayQuestion2').innerText = targetUser.security_q2;
            }
        } else {
            Swal.fire({ icon: 'error', text: 'User not found' });
        }
    });

    document.getElementById('methodSecurityBtn').addEventListener('click', () => {
        document.getElementById('step2').style.display = 'none';
        document.getElementById('step3A').style.display = 'block';
    });

    document.getElementById('methodAdminBtn').addEventListener('click', () => {
        // Unified Storage: Simulated Admin Request
        document.getElementById('step2').style.display = 'none';
        document.getElementById('step3B').style.display = 'block';
    });

    document.getElementById('resetPasswordBtn').addEventListener('click', () => {
        const ans1 = document.getElementById('security_answer1').value;
        const ans2 = document.getElementById('security_answer2').value;
        const new_password = document.getElementById('new_password').value;
        const passErr = window.getPasswordError(new_password);
        if (passErr) {
            Swal.fire({ icon: 'error', title: 'Invalid Password', text: passErr });
            return;
        }
        const lang = localStorage.getItem('krishi_mitra_lang') || 'en';
        const t = translations[lang];

        if ((!ans1 && !ans2) || !new_password) return Swal.fire({ icon: 'warning', text: t.all_fields_required });

        // Logic: Correct answer to ANY ONE question
        let verified = false;
        if (ans1 && targetUser.security_answer && ans1.toLowerCase() === targetUser.security_answer.toLowerCase()) {
            verified = true;
        } else if (ans2 && targetUser.security_a2 && ans2.toLowerCase() === targetUser.security_a2.toLowerCase()) {
            verified = true;
        }

        if (verified) {
            const users = JSON.parse(localStorage.getItem('users') || '[]');
            const userIdx = users.findIndex(u => u.id === targetUser.id);
            if (userIdx !== -1) {
                users[userIdx].password = new_password;
                localStorage.setItem('users', JSON.stringify(users));
                Swal.fire({
                    icon: 'success',
                    title: 'Success',
                    text: t.password_reset_success,
                    confirmButtonColor: '#28a745'
                }).then(() => {
                    window.location.href = 'login.html';
                });
            }
        } else {
            Swal.fire({ icon: 'error', text: 'Incorrect security answer(s)' });
        }
    });
</script>
</body>
</html>
