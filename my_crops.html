        :root { --primary-green: #1a531b; --secondary-green: #2e7d32; }
        body { background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { height: 100vh; background: var(--primary-green); color: white; position: fixed; width: 250px; transition: all 0.3s; z-index: 1000; }
        .sidebar a { color: #cfdfcf; text-decoration: none; padding: 12px 20px; display: block; transition: 0.2s; border-radius: 8px; margin: 4px 10px; }
        .sidebar a:hover, .sidebar a.active { background: var(--secondary-green); color: white; }
        .sidebar .bottom-links { position: absolute; bottom: 20px; width: 100%; }
        .main-content { margin-left: 250px; padding: 20px; transition: all 0.3s; }
        .mobile-nav { display: none; background: var(--primary-green); color: white; padding: 10px 20px; position: sticky; top: 0; z-index: 1001; }
        .crop-card { border: none; border-radius: 15px; transition: transform 0.2s; }
        .crop-card:hover { transform: translateY(-5px); }
        .badge-status { position: absolute; top: 15px; right: 15px; }
        
        /* Enhanced Reminder Styles */
        .reminder-card {
            border: 1px solid #e0e0e0;
            border-radius: 16px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: white;
            overflow: hidden;
        }
        .reminder-card:hover {
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            border-color: var(--secondary-green);
        }
        .reminder-card.completed {
            background: #f8f9fa;
            border-color: #dee2e6;
            opacity: 0.8;
        }
        .reminder-type-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            font-size: 1.25rem;
        }
        .reminder-time {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            letter-spacing: -0.02em;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); width: 250px; }
            .sidebar.active { transform: translateX(0); }
            .main-content { margin-left: 0; }
            .mobile-nav { display: flex; justify-content: space-between; align-items: center; }
            .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; }

<div class="main-content">

<!-- Add Crop Modal -->
<div class="modal fade" id="addCropModal" tabindex="-1" aria-hidden="true">

                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <form id="addCropForm">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-bold" data-t="my_crops">Crop Name</label>
                            <select class="form-select" id="cropNameSelect" required>
                                <!-- Options loaded from admin data -->
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold" data-t="seed_type">Seed Type</label>
                            <select class="form-select" id="seedTypeSelect" required>
                                <!-- Options loaded from admin data -->
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold" data-t="fertilizers">Fertilizer</label>
                            <select class="form-select" id="fertilizerSelect" required>
                                <!-- Options loaded from admin data -->
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold" data-t="pesticides">Pesticide</label>
                            <select class="form-select" id="pesticideSelect" required>
                                <!-- Options loaded from admin data -->
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold" data-t="sowing_date">Sowing Date</label>
                            <input type="date" class="form-control" id="sowingDateInput" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold" data-t="crop_duration">Crop Duration (Days)</label>
                            <input type="number" class="form-control" id="cropDurationInput" required>

                            <label class="form-label fw-bold" data-t="expected_harvest_date">Expected Harvest Date</label>

                    <button type="submit" class="btn btn-success w-100 py-2 rounded-3 mt-4" data-t="submit">Submit</button>

</div>

<!-- Complete Crop Modal -->

                        <div class="col-md-4">

                        <div class="col-md-4">

                            <input type="text" class="form-control" id="problemsInput" placeholder="Flood, pest attack, etc.">

                    </div>
                    <button type="submit" class="btn btn-success w-100 py-2 rounded-3 mt-4" data-t="submit">Submit</button>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Reminder Modal -->
<div class="modal fade" id="reminderModal" tabindex="-1" aria-hidden="true">

        <div class="modal-content border-0 rounded-4 shadow">

                    </div>
                    <button type="submit" class="btn btn-success w-100 py-2 rounded-3 mt-3" data-t="submit">Submit</button>
                </form>
            </div>
        </div>
    </div>
</div>

    // Auto Season Detection
    function detectSeason(month) {
        // Rabi: Oct-Mar, Kharif: Jun-Sep, Zaid: Mar-Jun
        if (month >= 10 || month <= 3) return 'Rabi';
        if (month >= 6 && month <= 9) return 'Kharif';
        return 'Zaid';
    }

    function getCropSeason(cropName, sowingDate) {
        const crop = cropsData.find(c => c.name_en === cropName);
        if (crop && crop.season_en && crop.season_en !== 'Year-round' && crop.season_en !== 'Annual') {
            return crop.season_en.split(' / ')[0]; // Take first if multiple
        }
        if (sowingDate) {
            const month = new Date(sowingDate).getMonth() + 1;
            return detectSeason(month);
        }
        return 'Unknown';
    }

    // Auto-calculate harvest date
    function updateHarvestDate() {
        const sowingDate = document.getElementById('sowingDateInput').value;
        const duration = document.getElementById('cropDurationInput').value;
        if (sowingDate && duration) {
            const date = new Date(sowingDate);
            date.setDate(date.getDate() + parseInt(duration));
            document.getElementById('harvestDateInput').value = date.toISOString().split('T')[0];
        }
    }

    document.getElementById('sowingDateInput').addEventListener('change', updateHarvestDate);
    document.getElementById('cropDurationInput').addEventListener('input', updateHarvestDate);

    // Crop Management Logic
    function calculateProgress(sowingDate, duration) {
        const start = new Date(sowingDate);
        const today = new Date();
        const diffTime = Math.abs(today - start);
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        let progress = Math.round((diffDays / duration) * 100);
        if (progress > 100) progress = 100;
        if (today < start) progress = 0;
        return progress;
    }

    // Cost Breakdown Difference Calculation
    function updateCostDifference() {
        const totalCost = parseFloat(document.getElementById('totalCostInput').value) || 0;
        const costSeed = parseFloat(document.getElementById('costSeed').value) || 0;
        const costFert = parseFloat(document.getElementById('costFert').value) || 0;
        const costPest = parseFloat(document.getElementById('costPest').value) || 0;
        const costLabor = parseFloat(document.getElementById('costLabor').value) || 0;
        const costIrri = parseFloat(document.getElementById('costIrri').value) || 0;
        
        const sum = costSeed + costFert + costPest + costLabor + costIrri;
        const diff = totalCost - sum;
        
        const display = document.getElementById('costDiffDisplay');
        display.innerText = `₹ ${diff.toLocaleString()}`;
        display.className = diff === 0 ? 'fw-bold text-success' : 'fw-bold text-danger';
    }

    document.getElementById('totalCostInput').addEventListener('input', updateCostDifference);
    document.querySelectorAll('.breakdown-input').forEach(input => {

    });

    document.getElementById('completeCropForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const lang = localStorage.getItem('krishi_mitra_lang') || 'en';
        const t = translations[lang];

        let currentCrops = JSON.parse(localStorage.getItem('currentCrops') || '[]');
        let pastCrops = JSON.parse(localStorage.getItem('pastCrops') || '[]');
        
        const cropToComplete = currentCrops.find(c => String(c.id) == String(activeCropId));
        if (!cropToComplete) return;

        const totalCost = parseFloat(document.getElementById('totalCostInput').value);
        const totalProduction = parseFloat(document.getElementById('totalProductionInput').value);
        const sellingPriceInput = document.getElementById('sellingPriceInput').value;
        const sellingPrice = sellingPriceInput ? parseFloat(sellingPriceInput) : null;
        const actualProfitInput = document.getElementById('totalProfitInput').value;

        // Cost Breakdown Validation
        const costSeed = parseFloat(document.getElementById('costSeed').value) || 0;
        const costFert = parseFloat(document.getElementById('costFert').value) || 0;
        const costPest = parseFloat(document.getElementById('costPest').value) || 0;
        const costLabor = parseFloat(document.getElementById('costLabor').value) || 0;
        const costIrri = parseFloat(document.getElementById('costIrri').value) || 0;
        const breakdownSum = costSeed + costFert + costPest + costLabor + costIrri;

        if (Math.abs(breakdownSum - totalCost) > 0.01) {
            Swal.fire('Warning', t.cost_mismatch_warning || 'Cost breakdown is not equal to total cost. Please adjust values.', 'warning');
            return;
        }

        const marketPrice = getMarketPrice(cropToComplete.name);
        const effectiveSellingPrice = sellingPrice !== null ? sellingPrice : marketPrice;
        const totalIncome = totalProduction * effectiveSellingPrice;
        
        // Auto calculate profit if not entered
        const finalProfit = (actualProfitInput !== "" && actualProfitInput !== null) ? parseFloat(actualProfitInput) : (totalIncome - totalCost);

        // Auto assign soil type if not selected
        let soilType = document.getElementById('soilTypeSelect').value;
        if (!soilType) {
            const cropData = cropsData.find(cd => cd.name_en === cropToComplete.name);
            soilType = cropData ? cropData.soil_en.split(',')[0] : 'Loamy';
        }

        const completedCrop = { 
            ...cropToComplete, 
            status: 'Completed',
            total_cost: totalCost,
            total_production: totalProduction,
            selling_price: effectiveSellingPrice,
            total_income: totalIncome,
            actual_profit: finalProfit,
            market_price: marketPrice,
            problems: document.getElementById('problemsInput').value,
            cost_seed: costSeed,
            cost_fert: costFert,
            cost_pest: costPest,
            cost_labor: costLabor,
            cost_irri: costIrri,
            soil_type: soilType,
            spray_count: parseInt(document.getElementById('sprayCountInput').value) || 0,
            fertilizer_quantity: parseFloat(document.getElementById('fertQuantityInput').value) || 0,
            fertilizer_name: document.getElementById('fertNameInput').value || cropToComplete.fertilizer
        };

        // STEP 1: Remove from currentCrops
        currentCrops = currentCrops.filter(c => String(c.id) != String(activeCropId));
        
        // STEP 2: Add to pastCrops
        pastCrops.push(completedCrop);

        // STEP 3: Save updated arrays to localStorage
        localStorage.setItem('currentCrops', JSON.stringify(currentCrops));
        localStorage.setItem('pastCrops', JSON.stringify(pastCrops));
        
        console.log("Crop completed and moved from currentCrops to pastCrops.");
        console.log("Completed Crop Details:", completedCrop);

        bootstrap.Modal.getInstance(document.getElementById('completeCropModal')).hide();
        document.getElementById('completeCropForm').reset();
        loadCrops();
        Swal.fire('Success', 'Crop marked as completed and moved to past crops!', 'success');
    });

                                </button>
                                <button class="btn btn-sm btn-outline-primary rounded-circle p-0 d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;" onclick="openEditReminderModal(${r.id})">
                                    <i class="bi bi-pencil"></i>
                                </button>
                            ` : `
                                <button class="btn btn-sm btn-light flex-grow-1 rounded-pill text-muted" disabled>
                                    <i class="bi bi-check-circle-fill me-1 text-success"></i> ${t.completed}
                                </button>
                            `}
                            <button class="btn btn-sm btn-outline-danger rounded-circle p-0 d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;" onclick="deleteReminder(${r.id})">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    function openEditReminderModal(id) {
        const reminders = JSON.parse(localStorage.getItem('farmer_reminders') || '[]');
        const r = reminders.find(rem => rem.id === id);
        if (r) {
            document.getElementById('reminderId').value = r.id;
            document.getElementById('taskType').value = r.type;
            document.getElementById('reminderDate').value = r.date;
            document.getElementById('reminderTime').value = r.time;
            document.getElementById('reminderNote').value = r.note || '';
            document.getElementById('reminderModalTitle').innerText = translations[localStorage.getItem('krishi_mitra_lang') || 'en'].edit_reminder;
            new bootstrap.Modal(document.getElementById('reminderModal')).show();
        }
    }

    document.getElementById('reminderForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const lang = localStorage.getItem('krishi_mitra_lang') || 'en';
        const t = translations[lang];
        const id = document.getElementById('reminderId').value;

        let reminders = JSON.parse(localStorage.getItem('farmer_reminders') || '[]');
        
        if (id) {
            // Edit
            reminders = reminders.map(r => {
                if (r.id == id) {
                    return {
                        ...r,
                        type: document.getElementById('taskType').value,
                        date: document.getElementById('reminderDate').value,
                        time: document.getElementById('reminderTime').value,
                        note: document.getElementById('reminderNote').value
                    };
                }
                return r;
            });
        } else {
            // Add
            const newReminder = {
                id: Date.now(),
                farmer_id: user.id,
                type: document.getElementById('taskType').value,
                date: document.getElementById('reminderDate').value,
                time: document.getElementById('reminderTime').value,
                note: document.getElementById('reminderNote').value,
                completed: false
            };
            reminders.push(newReminder);
        }

        localStorage.setItem('farmer_reminders', JSON.stringify(reminders));
        bootstrap.Modal.getInstance(document.getElementById('reminderModal')).hide();
        document.getElementById('reminderForm').reset();
        document.getElementById('reminderId').value = '';
        document.getElementById('reminderModalTitle').innerText = t.add_reminder;

        Swal.fire({
            icon: 'success',
            title: id ? 'Reminder updated!' : t.reminder_added,
            timer: 2000,
            showConfirmButton: false
        });

        loadReminders();
    });

    function toggleReminder(id) {
        let reminders = JSON.parse(localStorage.getItem('farmer_reminders') || '[]');
        reminders = reminders.map(r => {
            if (r.id === id) {
                return { ...r, completed: true };
            }
            return r;
        });
        localStorage.setItem('farmer_reminders', JSON.stringify(reminders));
        loadReminders();
    }

    function deleteReminder(id) {
        let reminders = JSON.parse(localStorage.getItem('farmer_reminders') || '[]');
        reminders = reminders.filter(r => r.id !== id);
        localStorage.setItem('farmer_reminders', JSON.stringify(reminders));
        loadReminders();
    }

    // Chart Logic
    let profitChartInstance = null;
    function updateProfitChart(pastCrops, growingCrops) {
        const ctx = document.getElementById('profitChart').getContext('2d');
        const lang = localStorage.getItem('krishi_mitra_lang') || 'en';
        const t = translations[lang];

        if (profitChartInstance) profitChartInstance.destroy();

        const labels = pastCrops.map(c => {
            const date = c.sowing_date ? new Date(c.sowing_date) : new Date();
            return `${c.name} (${date.getFullYear()})`;
        });
        const costData = pastCrops.map(c => c.total_cost || 0);
        const profitData = pastCrops.map(c => c.actual_profit || 0);

        if (growingCrops && growingCrops.length > 0) {
            growingCrops.forEach(c => {
                labels.push(`${c.name} (Est.)`);
                costData.push(c.estimated_cost || 0);
                profitData.push(0);
            });
        }

        profitChartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: t.total_cost,
                        data: costData,
                        backgroundColor: 'rgba(220, 53, 69, 0.7)',
                        borderColor: '#dc3545',
                        borderWidth: 1,
                        borderRadius: 5
                    },
                    {
                        label: t.actual_profit,
                        data: profitData,
                        backgroundColor: 'rgba(25, 135, 84, 0.7)',
                        borderColor: '#198754',
                        borderWidth: 1,
                        borderRadius: 5
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'top', labels: { usePointStyle: true, padding: 20 } },
                    tooltip: {
                        backgroundColor: 'rgba(0,0,0,0.8)',
                        padding: 12,
                        titleFont: { size: 14 },
                        bodyFont: { size: 13 },
                        callbacks: {
                            label: function(context) {
                                return context.dataset.label + ': ₹ ' + context.raw.toLocaleString();
                            }
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: { color: 'rgba(0,0,0,0.05)' },
                        ticks: {
                            callback: function(value) { return '₹' + value.toLocaleString(); }
                        }
                    },
                    x: { grid: { display: false } }
                }
            }
        });
    }

    function updateUI() {
        applyTranslations();
        populateDropdowns();
        loadCrops();
        loadReminders();
    }

    updateUI();

    // Listen for language changes
    window.addEventListener('storage', (e) => {
        if (e.key === 'krishi_mitra_lang') {
            updateUI();
        }
    });
</script>
</body>
</html>
