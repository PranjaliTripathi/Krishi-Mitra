<!DOCTYPE html>

    <style>

            box-shadow: 0 10px 25px rgba(0,0,0,0.05);

            text-align: center;

            background-color: var(--primary-green);
            color: white;
            font-weight: 600;
            border-radius: 12px;
            padding: 12px 30px;
            text-decoration: none;
            display: inline-block;
            margin-top: 40px;

            box-shadow: 0 4px 12px rgba(27, 94, 32, 0.2);

        .back-btn:hover {
            background-color: #0c3d0f;
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(27, 94, 32, 0.3);

            .policy-container { padding: 30px 20px; }
            .policy-header h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div class="policy-container">

                    <h3>Introduction</h3>
                    <p>At Krishi Mitra, we are committed to protecting the privacy and security of our users, primarily the farming community and regional administrators. This Privacy Policy outlines how we collect, use, disclose, and safeguard your information when you interact with our Smart Farmer Advisory System. By utilizing our platform, you consent to the data practices described in this document. We understand the sensitive nature of agricultural data and strive to maintain the highest standards of data integrity.</p>

                    <p>We collect information that you provide directly to us through the registration process, query submissions, and contact forms. This includes personally identifiable information such as your name, mobile number, email address, and geographical location related to your farming land. Additionally, we may collect technical data such as your IP address, browser type, and interaction logs with the platform to improve our system performance and ensure a secure operating environment.</p>

                    <p>हम वह जानकारी एकत्र करते हैं जो आप पंजीकरण प्रक्रिया, प्रश्न प्रस्तुतियाँ और संपर्क फ़ॉर्म के माध्यम से सीधे हमें प्रदान करते हैं। इसमें व्यक्तिगत रूप से पहचान योग्य जानकारी जैसे आपका नाम, मोबाइल नंबर, ईमेल पता और आपकी कृषि भूमि से संबंधित भौगोलिक स्थिति शामिल है। इसके अतिरिक्त, हम तकनीकी डेटा जैसे कि आपका आईपी पता, ब्राउज़र प्रकार और प्लेटफ़ॉर्म के साथ बातचीत लॉग एकत्र कर सकते हैं ताकि हमारे सिस्टम प्रदर्शन में सुधार हो सके और एक सुरक्षित ऑपरेटिंग वातावरण सुनिश्चित हो सके।</p>

                    <h3>तृतीय-पक्ष लिंक अस्वीकरण</h3>
                    <p>हमारे प्लेटफ़ॉर्म में बाहरी वेबसाइटों के लिंक शामिल हैं, जिनमें सरकारी पोर्टल (PM-Kisan, eNAM, आदि) और मौसम विभाग शामिल हैं। कृपया ध्यान दें कि कृषि मित्र ऐसी अन्य साइटों की गोपनीयता प्रथाओं या सामग्री के लिए ज़िम्मेदार नहीं है। हम अपने उपयोगकर्ताओं को प्रोत्साहित करते हैं कि जब वे हमारे प्लेटफ़ॉर्म को छोड़ें तो वे सचेत रहें और व्यक्तिगत रूप से पहचान योग्य जानकारी एकत्र करने वाली प्रत्येक वेबसाइट के गोपनीयता बयानों को पढ़ें। यह गोपनीयता नीति केवल कृषि मित्र द्वारा एकत्र की गई जानकारी पर लागू होती है।</p>

        function renderPolicy() {
            const lang = localStorage.getItem('krishi_mitra_lang') || 'en';
            const strings = translations[lang];

            document.getElementById('policyTitle').innerText = strings.title;
            document.getElementById('lastUpdated').innerText = strings.updated;
            document.getElementById('backBtnText').innerHTML = strings.back;
            document.getElementById('policyContent').innerHTML = strings.content;
            
            document.title = strings.title + " - Krishi Mitra";
        }

        window.addEventListener('DOMContentLoaded', renderPolicy);
