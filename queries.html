<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-t="my_queries">Krishi Mitra - My Queries</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root { --primary-green: #1a531b; --secondary-green: #2e7d32; }
        body { background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { height: 100vh; background: var(--primary-green); color: white; position: fixed; width: 250px; transition: all 0.3s; z-index: 1000; }
        .sidebar a { color: #cfdfcf; text-decoration: none; padding: 12px 20px; display: block; transition: 0.2s; border-radius: 8px; margin: 4px 10px; }
        .sidebar a:hover, .sidebar a.active { background: var(--secondary-green); color: white; }
        .sidebar .bottom-links { position: absolute; bottom: 20px; width: 100%; }
        .main-content { margin-left: 250px; padding: 20px; transition: all 0.3s; }
        .mobile-nav { display: none; background: var(--primary-green); color: white; padding: 10px 20px; position: sticky; top: 0; z-index: 1001; }
        .query-card { border: none; border-radius: 15px; }
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); width: 250px; }
            .sidebar.active { transform: translateX(0); }
            .main-content { margin-left: 0; }
            .mobile-nav { display: flex; justify-content: space-between; align-items: center; }
            .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; }
            .overlay.active { display: block; }
        }
    </style>
</head>
<body>

<div class="overlay" id="overlay"></div>

<div class="mobile-nav">
    <h4 class="mb-0"><i class="bi bi-leaf"></i> Krishi Mitra</h4>
    <button class="btn text-white fs-3 p-0" id="menuToggle"><i class="bi bi-list"></i></button>
</div>

<div class="sidebar" id="sidebar">
    <div class="p-4 text-center">
        <h3 class="fw-bold"><i class="bi bi-leaf"></i> <span data-t="brand">Krishi Mitra</span></h3>
    </div>
    <nav>
        <a href="farmer_dashboard.html"><i class="bi bi-speedometer2 me-2"></i> <span data-t="dashboard">Dashboard</span></a>
        <a href="weather.html"><i class="bi bi-cloud-sun me-2"></i> <span data-t="weather_nav">Weather</span></a>
        <a href="my_crops.html"><i class="bi bi-tree me-2"></i> <span data-t="my_crops_nav">My Crops</span></a>
        <a href="all_crops_info.html"><i class="bi bi-journal-text me-2"></i> <span data-t="all_crops_info_nav">Smart Crop Information</span></a>
        <a href="schemes.html"><i class="bi bi-award me-2"></i> <span data-t="schemes_nav">Schemes</span></a>
        <a href="market_prices.html"><i class="bi bi-graph-up-arrow me-2"></i> <span data-t="market_prices_nav">Market Price</span></a>
        <a href="notifications.html"><i class="bi bi-bell me-2"></i> <span data-t="notifications_nav">Notifications</span></a>
        <a href="queries.html" class="active"><i class="bi bi-question-circle me-2"></i> <span data-t="my_queries">My Questions</span></a>
        
        <div class="bottom-links">
            <a href="profile.html"><i class="bi bi-person-circle me-2"></i> <span data-t="profile_nav">Profile</span></a>
            <a href="#" id="logoutBtn" class="text-danger"><i class="bi bi-box-arrow-right me-2"></i> <span data-t="logout">Logout</span></a>
        </div>
    </nav>
</div>

<div class="main-content">
    <div class="container">
        <h2 class="mb-4 fw-bold" data-t="my_queries">My Queries</h2>

        <div class="row">
            <div class="col-lg-5 mb-4">
                <div class="card query-card shadow-sm p-4">
                    <h5 class="fw-bold mb-4" data-t="submit_new_query">Submit New Query</h5>
                    <form id="queryForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold" data-t="your_question">Your Question</label>
                            <textarea class="form-control" id="question" rows="4" placeholder="Ask anything about your crops..." data-t="ask_anything_ph" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-success w-100 py-2 rounded-3" data-t="submit_question">Submit Question</button>
                    </form>
                </div>
            </div>

            <div class="col-lg-7 mb-4">
                <div class="card query-card shadow-sm p-4 h-100">
                    <h5 class="fw-bold mb-4" data-t="previous_queries">My Previous Queries</h5>
                    <div id="queryList">
                        <!-- Queries will be loaded here -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="translations.js"></script>
<script>
    // Sidebar Toggle
    const menuToggle = document.getElementById('menuToggle');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');

    menuToggle.addEventListener('click', () => {
        sidebar.classList.add('active');
        overlay.classList.add('active');
    });

    overlay.addEventListener('click', () => {
        sidebar.classList.remove('active');
        overlay.classList.remove('active');
    });

    const user = JSON.parse(localStorage.getItem('user'));
    if (!user || user.role !== 'farmer') window.location.href = 'login.html';

    function loadQueries() {
        const queries = JSON.parse(localStorage.getItem('queries') || '[]').filter(q => q.farmerEmail === user.email || q.farmer_id === user.id);
        const queryList = document.getElementById('queryList');
        const lang = localStorage.getItem('krishi_mitra_lang') || 'en';
        const t = translations[lang];

        if (queries.length === 0) {
            queryList.innerHTML = `<div class="text-center text-muted py-5"><i class="bi bi-chat-dots-fill fs-1 d-block mb-3 opacity-25"></i>${t.no_queries}</div>`;
            return;
        }

        queryList.innerHTML = queries.slice().reverse().map(q => {
            const hasAnswer = q.answer && q.status === 'answered';
            
            let d = q.date;
            let t_val = q.time;
            if(!d && q.created_at) {
                const dt = new Date(q.created_at);
                d = dt.toLocaleDateString('en-GB');
                t_val = dt.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            }

            return `
            <div class="card border-0 shadow-sm rounded-4 mb-4 overflow-hidden">
                <div class="card-body p-4 border-start border-5 border-${hasAnswer ? 'success' : 'warning'}">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <div class="d-flex align-items-center text-muted small">
                            <i class="bi bi-calendar-event me-2"></i> ${d || 'N/A'}
                            <i class="bi bi-clock ms-3 me-2"></i> ${t_val || '--:--'}
                        </div>
                        <span class="badge ${hasAnswer ? 'bg-success-subtle text-success' : 'bg-warning-subtle text-warning'} rounded-pill px-3">
                            ${hasAnswer ? t.answered_status : t.pending_status}
                        </span>
                    </div>
                    
                    <div class="mb-3">
                        <p class="fw-bold mb-0 text-dark" style="font-size: 1.1rem;">${q.text || q.question}</p>
                    </div>

                    ${hasAnswer ? `
                        <div class="mt-4 p-3 bg-success bg-opacity-10 rounded-4 border-start border-4 border-success">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <span class="fw-bold text-success"><i class="bi bi-person-check-fill me-2"></i>${t.expert_reply}</span>
                                <small class="text-muted"><i class="bi bi-clock me-1"></i> ${q.answeredDate || ''} ${q.answeredTime || ''}</small>
                            </div>
                            <p class="mb-0 text-dark">${q.answer}</p>
                            ${q.answeredBy ? `<div class="text-end mt-2"><small class="text-muted opacity-75"><span data-t="answered_by">${t.answered_by}</span>: ${q.answeredBy}</small></div>` : ''}
                        </div>
                    ` : `
                        <div class="mt-3 p-3 bg-light rounded-4 text-center border">
                            <i class="bi bi-hourglass-split me-2 text-warning animate-spin"></i>
                            <span class="text-muted small">${t.waiting_admin || 'Waiting for admin response...'}</span>
                        </div>
                    `}
                </div>
            </div>
        `}).join('');
    }

    document.getElementById('queryForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const questionText = document.getElementById('question').value;
        const now = new Date();
        
        const newQuery = {
            id: Date.now(),
            farmerId: user.id, // For backward compatibility
            farmer_id: user.id,
            farmerName: user.name,
            farmer_name: user.name,
            farmerEmail: user.email,
            text: questionText, // Standard field in admin
            question: questionText, // For backward compatibility
            answer: null,
            status: 'pending',
            date: now.toLocaleDateString('en-GB'),
            time: now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }),
            created_at: now.toISOString()
        };

        const queries = JSON.parse(localStorage.getItem('queries') || '[]');
        queries.push(newQuery);
        localStorage.setItem('queries', JSON.stringify(queries));

        const lang = localStorage.getItem('krishi_mitra_lang') || 'en';
        const t = translations[lang];

        document.getElementById('question').value = '';
        Swal.fire({
            icon: 'success',
            title: t.submitted,
            text: t.expert_reply_soon,
            confirmButtonColor: '#1a531b'
        });
        loadQueries();
    });

    // Logout with Confirmation
    document.getElementById('logoutBtn').addEventListener('click', () => {
        const lang = localStorage.getItem('krishi_mitra_lang') || 'en';
        const t = translations[lang];
        Swal.fire({
            title: t.logout_confirm_title,
            text: t.logout_confirm,
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#28a745',
            cancelButtonColor: '#d33',
            confirmButtonText: t.logout
        }).then((result) => {
            if (result.isConfirmed) {
                localStorage.removeItem('user');
                window.location.href = 'index.html#top';
            }
        });
    });

    loadQueries();
</script>
</body>
</html>
