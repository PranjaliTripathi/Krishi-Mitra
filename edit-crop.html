<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Crop - Krishi Mitra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8f9fa; color: #333; margin: 0; padding-top: 100px; }
        .card { border-radius: 12px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05); mb-4 }
        .form-label { font-weight: 600; color: #444; font-size: 0.9rem; text-transform: uppercase; }
        .section-title { font-weight: 700; color: #1a531b; border-bottom: 2px solid #e9ecef; padding-bottom: 10px; margin-bottom: 20px; font-size: 1.2rem; }
        .btn-success { background-color: #1a531b; border: none; }
        .btn-success:hover { background-color: #134014; }
        
        .top-header { 
            position: fixed; top: 0; left: 0; width: 100%; height: 60px; 
            background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
            display: flex; justify-content: flex-end; align-items: center; 
            padding: 0 20px; z-index: 9997; gap: 15px; 
        }
        .nav-row {
            position: fixed; top: 60px; left: 0; width: 100%; height: 40px;
            background: #f8f9fa; display: flex; justify-content: space-between;
            align-items: center; padding: 0 20px; z-index: 9996;
            border-bottom: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="top-header">
        <a href="admin_dashboard.html" onclick="showSection('admProfile', document.getElementById('navProfile'))"><i class="bi bi-person-circle fs-4 text-dark"></i></a>
        <button class="btn btn-outline-success btn-sm" onclick="toggleLang()"><span id="langToggleText">Eng</span></button>
        <button class="btn btn-danger btn-sm" onclick="handleLogout()">Logout</button>
    </div>
    
    <div class="nav-row">
        <button class="btn btn-link text-dark fw-bold text-decoration-none" onclick="history.back()">← वापस जाएं</button>
        <button class="btn btn-link text-dark fw-bold text-decoration-none" onclick="window.location.href='admin_dashboard.html'">🏠 होम</button>
    </div>

<div class="container pb-5" style="margin-top: 30px;">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="mb-0 fw-bold text-success" id="pageTitle">Crop Details</h4>  
        <div style="width: 100px;"></div>
    </div>
    <form id="editForm" onsubmit="saveData(event)">
        <!-- 1. Basic Info -->
        <div class="card p-4 mb-4">
            <h5 class="section-title">1. Basic Info</h5>
            <div class="row g-4">
                <div class="col-md-6">
                    <label class="form-label">Crop Name (Hindi)</label>
                    <input type="text" id="name_hi" class="form-control rounded-3" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Crop Name (English)</label>
                    <input type="text" id="name_en" class="form-control rounded-3" required>
                </div>
            </div>
        </div>

        <!-- 2. Crop Details -->
        <div class="card p-4 mb-4">
            <h5 class="section-title">2. Crop Details</h5>
            <div class="row g-4">
                <div class="col-md-6">
                    <label class="form-label">Soil Type (Hindi)</label>
                    <input type="text" id="soil_hi" class="form-control rounded-3" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Soil Type (English)</label>
                    <input type="text" id="soil_en" class="form-control rounded-3" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Season</label>
                    <select id="season" class="form-select rounded-3">
                        <option value="Kharif">Kharif</option>
                        <option value="Rabi">Rabi</option>
                        <option value="Zaid">Zaid</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Duration (Days)</label>
                    <input type="number" id="duration" class="form-control rounded-3" required min="0" oninput="if(this.value<0)this.value=Math.abs(this.value)">
                </div>
            </div>
        </div>

        <!-- 3. Risk & Status -->
        <div class="card p-4 mb-4">
            <h5 class="section-title">3. Risk & Status</h5>
            <div class="row g-4">
                <div class="col-md-6">
                    <label class="form-label">Risk Level</label>
                    <select id="risk" class="form-select rounded-3">
                        <option value="Low">Low</option>
                        <option value="Medium">Medium</option>
                        <option value="High">High</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Status</label>
                    <select id="status" class="form-select rounded-3">
                        <option value="Active">Active (सक्रिय)</option>
                        <option value="Hold">Hold (होल्ड)</option>
                        <option value="Deleted">Deleted (हटाया गया)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 4. Description -->
        <div class="card p-4 mb-4">
            <h5 class="section-title">4. Description</h5>
            <div class="row g-4">
                <div class="col-md-12">
                    <label class="form-label">About (Hindi)</label>
                    <textarea id="about_hi" class="form-control rounded-3" rows="3"></textarea>
                </div>
                <div class="col-md-12">
                    <label class="form-label">About (English)</label>
                    <textarea id="about_en" class="form-control rounded-3" rows="3"></textarea>
                </div>
            </div>
        </div>

        <!-- 5. Protection & Treatment -->
        <div class="card p-4 mb-4">
            <h5 class="section-title">5. Protection & Treatment</h5>
            <div class="row g-4">
                <div class="col-md-6">
                    <label class="form-label">Prevention (Hindi)</label>
                    <textarea id="prevention_hi" class="form-control rounded-3" rows="3"></textarea>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Prevention (English)</label>
                    <textarea id="prevention_en" class="form-control rounded-3" rows="3"></textarea>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Pests & Diseases (Hindi)</label>
                    <textarea id="pests_hi" class="form-control rounded-3" rows="3"></textarea>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Pests & Diseases (English)</label>
                    <textarea id="pests_en" class="form-control rounded-3" rows="3"></textarea>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Solutions / Treatment (Hindi)</label>
                    <textarea id="solutions_hi" class="form-control rounded-3" rows="3"></textarea>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Solutions / Treatment (English)</label>
                    <textarea id="solutions_en" class="form-control rounded-3" rows="3"></textarea>
                </div>

                <div class="col-md-6">
                    <label class="form-label">Recommended Practices (Hindi)</label>
                    <textarea id="practices_hi" class="form-control rounded-3" rows="3"></textarea>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Recommended Practices (English)</label>
                    <textarea id="practices_en" class="form-control rounded-3" rows="3"></textarea>
                </div>
            </div>
        </div>

        <div class="text-end mb-4">
            <button type="submit" class="btn btn-success rounded-pill px-5 py-2 fw-bold fs-5 shadow-sm">
                <i class="bi bi-save me-2"></i> <span data-t="save_changes">Save Changes</span>
            </button>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="translations.js"></script>
<script>
    let currentCropId = new URLSearchParams(window.location.search).get('id');
    const crops = JSON.parse(localStorage.getItem('admin_crops') || '[]');
    let currentCrop = crops.find(c => c.id == currentCropId);

    function initAuth() {
        const admin = JSON.parse(localStorage.getItem('admin_user'));
        if (!admin || admin.role !== 'admin') {
            window.location.href = 'login.html';
            return;
        }
    }

    function goBack() {
        window.location.href = 'admin_dashboard.html?section=crops';
    }

    function init() {
        initAuth();
        if (currentCropId) {
            if (!currentCrop) {
                alert('Crop not found');
                goBack();
                return;
            }
            populateForm();
            document.getElementById('pageTitle').innerText = (localStorage.getItem('krishi_mitra_lang') === 'hi' ? 'फसल विवरण संपादित करें' : 'Edit Crop Details');
        } else {
            currentCrop = { id: Date.now(), active: true, status: 'Active' };
            document.getElementById('pageTitle').innerText = (localStorage.getItem('krishi_mitra_lang') === 'hi' ? 'नई फसल जोड़ें' : 'Add New Crop');
        }
        applyLocalTranslations();
    }

    function populateForm() {
        document.getElementById('name_hi').value = currentCrop.name_hi || '';
        document.getElementById('name_en').value = currentCrop.name_en || '';
        document.getElementById('soil_hi').value = currentCrop.soil_hi || '';
        document.getElementById('soil_en').value = currentCrop.soil_en || '';
        document.getElementById('season').value = currentCrop.season || 'Kharif';
        document.getElementById('duration').value = currentCrop.duration || '';
        document.getElementById('risk').value = currentCrop.risk || 'Low';
        
        // Status resolution
        let cStatus = currentCrop.status || (currentCrop.active ? 'Active' : 'Inactive');
        if(cStatus === 'Inactive') cStatus = 'Hold';
        document.getElementById('status').value = cStatus;

        document.getElementById('about_hi').value = currentCrop.about_hi || '';
        document.getElementById('about_en').value = currentCrop.about_en || '';
        document.getElementById('prevention_hi').value = currentCrop.prevention_hi || '';
        document.getElementById('prevention_en').value = currentCrop.prevention_en || '';
        
        document.getElementById('pests_hi').value = currentCrop.pests_hi || '';
        document.getElementById('pests_en').value = currentCrop.pests_en || '';
        document.getElementById('solutions_hi').value = currentCrop.solutions_hi || '';
        document.getElementById('solutions_en').value = currentCrop.solutions_en || '';
        document.getElementById('practices_hi').value = currentCrop.practices_hi || '';
        document.getElementById('practices_en').value = currentCrop.practices_en || '';
    }

    function saveData(e) {
        e.preventDefault();
        const lang = localStorage.getItem('krishi_mitra_lang') || 'en';
        
        Swal.fire({
            title: lang === 'hi' ? 'क्या आप बदलाव सेव करना चाहते हैं?' : 'Do you want to save changes?',
            icon: 'question',
            showCancelButton: true,
            confirmButtonColor: '#1a531b',
            cancelButtonColor: '#6c757d',
            confirmButtonText: lang === 'hi' ? 'हाँ' : 'Yes',
            cancelButtonText: lang === 'hi' ? 'नहीं' : 'No'
        }).then((result) => {
            if (result.isConfirmed) {
                currentCrop.name_hi = document.getElementById('name_hi').value;
                currentCrop.name_en = document.getElementById('name_en').value;
                currentCrop.soil_hi = document.getElementById('soil_hi').value;
                currentCrop.soil_en = document.getElementById('soil_en').value;
                currentCrop.season = document.getElementById('season').value;
                currentCrop.duration = parseInt(document.getElementById('duration').value);
                currentCrop.risk = document.getElementById('risk').value;
                
                const stat = document.getElementById('status').value;
                currentCrop.status = stat;
                currentCrop.active = (stat === 'Active');

                currentCrop.about_hi = document.getElementById('about_hi').value;
                currentCrop.about_en = document.getElementById('about_en').value;
                currentCrop.prevention_hi = document.getElementById('prevention_hi').value;
                currentCrop.prevention_en = document.getElementById('prevention_en').value;
                
                currentCrop.pests_hi = document.getElementById('pests_hi').value;
                currentCrop.pests_en = document.getElementById('pests_en').value;
                currentCrop.solutions_hi = document.getElementById('solutions_hi').value;
                currentCrop.solutions_en = document.getElementById('solutions_en').value;
                currentCrop.practices_hi = document.getElementById('practices_hi').value;
                currentCrop.practices_en = document.getElementById('practices_en').value;

                if (!currentCropId) {
                    crops.push(currentCrop);
                }

                localStorage.setItem('admin_crops', JSON.stringify(crops));
                
                Swal.fire({
                    title: lang==='hi'?'सेव हो गया!':'Saved!',
                    text: '',
                    icon: 'success',
                    timer: 1500,
                    showConfirmButton: false
                }).then(() => {
                    goBack();
                });
            }
        });
    }

    function toggleLang() {
        let lang = localStorage.getItem('krishi_mitra_lang') || 'en';
        lang = lang === 'en' ? 'hi' : 'en';
        localStorage.setItem('krishi_mitra_lang', lang);
        applyLocalTranslations();
    }

    function applyLocalTranslations() {
        const lang = localStorage.getItem('krishi_mitra_lang') || 'en';
        document.getElementById('langToggleText').innerText = lang === 'en' ? 'हिंदी' : 'Eng';
        const t = translations[lang];
        if(!t) return;

        document.querySelectorAll('[data-t]').forEach(el => {
            const key = el.getAttribute('data-t');
            if (t[key]) {
                if (el.tagName === 'INPUT' && el.type === 'button') el.value = t[key];
                else el.innerText = t[key];
            }
        });
    }

    window.onload = init;
</script>
</body>
</html>
