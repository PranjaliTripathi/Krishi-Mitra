<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Support - Krishi Mitra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #1b5e20;
            --secondary-green: #4caf50;
            --bg-light: #f9fbf9;
            --text-dark: #111827;
        }
        body {
            font-family: 'Inter', sans-serif;
            color: var(--text-dark);
            background: linear-gradient(180deg, #ffffff 0%, #f0f7f0 100%);
            margin: 0;
            padding: 60px 20px;
            min-height: 100vh;
        }
        h1, h2, h3, .nav-brand {
            font-family: 'Poppins', sans-serif;
        }
        .contact-container {
            max-width: 650px;
            margin: 0 auto;
            background: white;
            padding: 50px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.08);
        }
        .contact-header {
            text-align: center;
            margin-bottom: 35px;
        }
        .contact-header h1 {
            color: var(--primary-green);
            font-weight: 800;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }
        .form-label {
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }
        .form-control {
            border-radius: 12px;
            padding: 12px 18px;
            border: 1.5px solid #e5e7eb;
            transition: all 0.3s;
        }
        .form-control:focus {
            border-color: var(--secondary-green);
            box-shadow: 0 0 0 4px rgba(76, 175, 80, 0.1);
        }
        .btn-submit {
            background-color: var(--primary-green);
            color: white;
            font-weight: 700;
            border-radius: 12px;
            padding: 14px;
            width: 100%;
            border: none;
            margin-top: 20px;
            transition: all 0.3s;
            box-shadow: 0 4px 12px rgba(27, 94, 32, 0.2);
        }
        .btn-submit:hover {
            background-color: #0c3d0f;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(27, 94, 32, 0.3);
        }
        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: var(--primary-green);
            text-decoration: none;
            font-weight: 600;
        }
        .back-link:hover {
            text-decoration: underline;
        }
        .alert {
            border-radius: 12px;
            margin-bottom: 25px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="contact-container">
        <div class="contact-header">
            <h1 id="pageTitle">Contact Support</h1>
            <p class="text-muted" id="pageSub">Have questions? We are here to help you.</p>
        </div>

        <div id="successAlert" class="alert alert-success">
            <i class="bi bi-check-circle-fill me-2"></i> <span id="successMsg">Your message has been sent successfully!</span>
        </div>

        <form id="contactForm">
            <div class="mb-3">
                <label for="name" class="form-label" id="lblName">Full Name</label>
                <input type="text" class="form-control" id="name" required placeholder="Enter your name">
            </div>
            <div class="mb-3">
                <label for="contact" class="form-label" id="lblContact">Mobile OR Email</label>
                <input type="text" class="form-control" id="contact" required placeholder="Enter mobile or email">
            </div>
            <div class="mb-4">
                <label for="message" class="form-label" id="lblMessage">Your Message</label>
                <textarea class="form-control" id="message" rows="5" required placeholder="How can we help you?"></textarea>
            </div>
            <button type="submit" class="btn-submit" id="btnSubmit">Send Message</button>
        </form>

        <a href="index.html" class="back-link" id="backLink"><i class="bi bi-arrow-left"></i> Back to Home</a>
    </div>

    <script>
        const translations = {
            en: {
                title: "Contact Support",
                sub: "Have questions? We are here to help you.",
                name: "Full Name",
                contact: "Mobile OR Email",
                message: "Your Message",
                submit: "Send Message",
                back: '<i class="bi bi-arrow-left"></i> Back to Home',
                success: "Your message has been sent successfully!",
                namePl: "Enter your name",
                contactPl: "Enter mobile or email",
                messagePl: "How can we help you?"
            },
            hi: {
                title: "संपर्क सहायता",
                sub: "कोई सवाल है? हम आपकी मदद के लिए यहां हैं।",
                name: "पूरा नाम",
                contact: "मोबाइल या ईमेल",
                message: "आपका संदेश",
                submit: "संदेश भेजें",
                back: '<i class="bi bi-arrow-left"></i> वापस घर जाएं',
                success: "आपका संदेश सफलतापूर्वक भेज दिया गया है!",
                namePl: "अपना नाम दर्ज करें",
                contactPl: "मोबाइल या ईमेल दर्ज करें",
                messagePl: "हम आपकी कैसे मदद कर सकते हैं?"
            }
        };

        function renderContact() {
            const lang = localStorage.getItem('krishi_mitra_lang') || 'en';
            const s = translations[lang];

            document.getElementById('pageTitle').innerText = s.title;
            document.getElementById('pageSub').innerText = s.sub;
            document.getElementById('lblName').innerText = s.name;
            document.getElementById('lblContact').innerText = s.contact;
            document.getElementById('lblMessage').innerText = s.message;
            document.getElementById('btnSubmit').innerText = s.submit;
            document.getElementById('backLink').innerHTML = s.back;
            document.getElementById('successMsg').innerText = s.success;

            document.getElementById('name').placeholder = s.namePl;
            document.getElementById('contact').placeholder = s.contactPl;
            document.getElementById('message').placeholder = s.messagePl;

            document.title = s.title + " - Krishi Mitra";
        }

        function formatDateTime() {
            const now = new Date();
            const d = String(now.getDate()).padStart(2, '0');
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const y = now.getFullYear();
            
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; // the hour '0' should be '12'
            const timeStr = String(hours).padStart(2, '0') + ':' + minutes + ' ' + ampm;
            
            return {
                date: `${d}/${m}/${y}`,
                time: timeStr
            };
        }

        document.getElementById('contactForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('name').value.trim();
            const contact = document.getElementById('contact').value.trim();
            const message = document.getElementById('message').value.trim();

            if (!name || !contact || !message) {
                alert("Please fill all required fields.");
                return;
            }

            const dt = formatDateTime();
            const newMessage = {
                id: Date.now(),
                name,
                contact,
                message,
                date: dt.date,
                time: dt.time,
                source: "Landing Page",
                replied: false,
                reply: ""
            };

            let messages = JSON.parse(localStorage.getItem('support_messages')) || [];
            messages.push(newMessage);
            localStorage.setItem('support_messages', JSON.stringify(messages));

            // Show success
            document.getElementById('contactForm').style.display = 'none';
            document.getElementById('successAlert').style.display = 'block';

            // Optional: Redirect after delay
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 3000);
        });

        window.addEventListener('DOMContentLoaded', renderContact);
    </script>
</body>
</html>
