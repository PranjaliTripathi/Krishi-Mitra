<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-t="knowledge_base">Krishi Mitra - Knowledge Base</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #f0f2f5; }
        .sidebar { height: 100vh; background: #1a531b; color: white; position: fixed; width: 250px; }
        .sidebar a { color: #cfdfcf; text-decoration: none; padding: 15px 20px; display: block; }
        .sidebar a:hover, .sidebar a.active { background: #2e7d32; color: white; }
        .main-content { margin-left: 250px; padding: 30px; }
        .lang-switch { position: absolute; top: 20px; right: 20px; z-index: 1000; }
        @media (max-width: 768px) {
            .sidebar { width: 100%; height: auto; position: relative; }
            .main-content { margin-left: 0; }
        }
    </style>
</head>
<body>

<div class="lang-switch">
    <button class="btn btn-outline-success btn-sm" onclick="toggleLanguage()">
        <i class="bi bi-translate"></i> <span id="langToggleText">हिंदी</span>
    </button>
</div>

<div class="sidebar">
    <div class="p-4 text-center">
        <h3 class="fw-bold"><i class="bi bi-leaf"></i> <span data-t="brand">Krishi Mitra</span></h3>
    </div>
    <nav>
        <a href="farmer_dashboard.html"><i class="bi bi-speedometer2 me-2"></i> <span data-t="dashboard">Dashboard</span></a>
        <a href="advisory.html"><i class="bi bi-lightbulb me-2"></i> <span data-t="crop_advisory">Crop Advisory</span></a>
        <a href="soil_health.html"><i class="bi bi-moisture me-2"></i> <span data-t="soil_health">Soil Health</span></a>
        <a href="pest_disease.html"><i class="bi bi-bug me-2"></i> <span data-t="pest_disease">Pest & Disease</span></a>
        <a href="market_prices.html"><i class="bi bi-graph-up-arrow me-2"></i> <span data-t="market_prices_nav">Market Prices</span></a>
        <a href="knowledge_base.html" class="active"><i class="bi bi-book me-2"></i> <span data-t="knowledge_base">Knowledge Base</span></a>
        <a href="queries.html"><i class="bi bi-question-circle me-2"></i> <span data-t="my_queries">My Queries</span></a>
        <a href="#" id="logoutBtn" class="mt-5 text-danger"><i class="bi bi-box-arrow-right me-2"></i> <span data-t="logout">Logout</span></a>
    </nav>
</div>

<div class="main-content">
    <h2 class="mb-4" data-t="knowledge_base_title">Knowledge Base & Farming Tips</h2>
    <div class="row" id="articleList">
        <!-- Articles will be loaded here -->
    </div>
</div>

<script src="translations.js"></script>
<script>
    function toggleLanguage() {
        const currentLang = localStorage.getItem('krishi_mitra_lang') || 'en';
        setLanguage(currentLang === 'en' ? 'hi' : 'en');
        loadArticles();
    }

    async function loadArticles() {
        try {
            const response = await fetch('http://localhost:5000/api/knowledge-base');
            const articles = await response.json();
            const list = document.getElementById('articleList');
            list.innerHTML = articles.map(a => `
                <div class="col-md-12 mb-4">
                    <div class="card border-0 shadow-sm rounded-4">
                        <div class="card-body">
                            <h5 class="card-title text-success">${a.title}</h5>
                            <span class="badge bg-info mb-2">${a.category}</span>
                            <p class="card-text">${a.content}</p>
                            <small class="text-muted">Published on: ${new Date(a.created_at).toLocaleDateString()}</small>
                        </div>
                    </div>
                </div>
            `).join('');
        } catch (err) {
            console.error(err);
        }
    }

    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.clear();
        window.location.href = 'index.html';
    });

    loadArticles();
</script>
</body>
</html>
