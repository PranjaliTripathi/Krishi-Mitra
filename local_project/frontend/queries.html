<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-t="my_queries">Krishi Mitra - My Queries</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #f0f2f5; }
        .sidebar { height: 100vh; background: #1a531b; color: white; position: fixed; width: 250px; }
        .sidebar a { color: #cfdfcf; text-decoration: none; padding: 15px 20px; display: block; }
        .sidebar a:hover, .sidebar a.active { background: #2e7d32; color: white; }
        .main-content { margin-left: 250px; padding: 30px; }
        .lang-switch { position: absolute; top: 20px; right: 20px; z-index: 1000; }
        @media (max-width: 768px) {
            .sidebar { width: 100%; height: auto; position: relative; }
            .main-content { margin-left: 0; }
        }
    </style>
</head>
<body>

<div class="lang-switch">
    <button class="btn btn-outline-success btn-sm" onclick="toggleLanguage()">
        <i class="bi bi-translate"></i> <span id="langToggleText">हिंदी</span>
    </button>
</div>

<div class="sidebar">
    <div class="p-4 text-center">
        <h3 class="fw-bold"><i class="bi bi-leaf"></i> <span data-t="brand">Krishi Mitra</span></h3>
    </div>
    <nav>
        <a href="farmer_dashboard.html"><i class="bi bi-speedometer2 me-2"></i> <span data-t="dashboard">Dashboard</span></a>
        <a href="advisory.html"><i class="bi bi-lightbulb me-2"></i> <span data-t="crop_advisory">Crop Advisory</span></a>
        <a href="soil_health.html"><i class="bi bi-moisture me-2"></i> <span data-t="soil_health">Soil Health</span></a>
        <a href="pest_disease.html"><i class="bi bi-bug me-2"></i> <span data-t="pest_disease">Pest & Disease</span></a>
        <a href="market_prices.html"><i class="bi bi-graph-up-arrow me-2"></i> <span data-t="market_prices_nav">Market Prices</span></a>
        <a href="knowledge_base.html"><i class="bi bi-book me-2"></i> <span data-t="knowledge_base">Knowledge Base</span></a>
        <a href="queries.html" class="active"><i class="bi bi-question-circle me-2"></i> <span data-t="my_queries">My Queries</span></a>
        <a href="#" id="logoutBtn" class="mt-5 text-danger"><i class="bi bi-box-arrow-right me-2"></i> <span data-t="logout">Logout</span></a>
    </nav>
</div>

<div class="main-content">
    <h2 class="mb-4" data-t="ask_question">Ask a Question</h2>
    <div class="row">
        <div class="col-md-5">
            <div class="card p-4 border-0 shadow-sm rounded-4">
                <h5 data-t="submit_new_query">Submit New Query</h5>
                <form id="queryForm">
                    <div class="mb-3">
                        <label class="form-label" data-t="your_question">Your Question</label>
                        <textarea class="form-control" id="question" rows="4" required data-t="your_question"></textarea>
                    </div>
                    <button type="submit" class="btn btn-success w-100" data-t="submit_question">Submit Question</button>
                </form>
            </div>
        </div>
        <div class="col-md-7">
            <div class="card p-4 border-0 shadow-sm rounded-4 bg-white">
                <h5 data-t="previous_queries">My Previous Queries</h5>
                <div id="queryList" class="mt-3">
                    <!-- Queries will be loaded here -->
                </div>
            </div>
        </div>
    </div>
</div>

<script src="translations.js"></script>
<script>
    function toggleLanguage() {
        const currentLang = localStorage.getItem('krishi_mitra_lang') || 'en';
        setLanguage(currentLang === 'en' ? 'hi' : 'en');
        loadQueries();
    }

    const user = JSON.parse(localStorage.getItem('user'));
    if (!user || user.role !== 'farmer') window.location.href = 'index.html';

    async function loadQueries() {
        try {
            const response = await fetch(`http://localhost:5000/api/farmer/queries/${user.id}`);
            const queries = await response.json();
            const list = document.getElementById('queryList');
            const lang = localStorage.getItem('krishi_mitra_lang') || 'en';
            const t = translations[lang];

            if (queries.length === 0) {
                list.innerHTML = `<p class="text-muted">${t.no_queries}</p>`;
                return;
            }
            list.innerHTML = queries.map(q => `
                <div class="card mb-3 border-0 bg-light rounded-3">
                    <div class="card-body">
                        <div class="d-flex justify-content-between">
                            <h6 class="fw-bold">Q: ${q.question}</h6>
                            <span class="badge ${q.status === 'pending' ? 'bg-warning' : 'bg-success'}">${q.status}</span>
                        </div>
                        <p class="mb-1 mt-2"><strong>A:</strong> ${q.answer || t.waiting_response}</p>
                        <small class="text-muted">${new Date(q.created_at).toLocaleString()}</small>
                    </div>
                </div>
            `).join('');
        } catch (err) {
            console.error(err);
        }
    }

    document.getElementById('queryForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const question = document.getElementById('question').value;
        const lang = localStorage.getItem('krishi_mitra_lang') || 'en';
        const t = translations[lang];

        try {
            const response = await fetch('http://localhost:5000/api/farmer/queries', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ farmer_id: user.id, question })
            });
            if (response.ok) {
                Swal.fire({
                    icon: 'success',
                    text: 'Question submitted successfully!',
                    confirmButtonColor: '#28a745'
                });
                document.getElementById('question').value = '';
                loadQueries();
            }
        } catch (err) {
            console.error(err);
        }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.clear();
        window.location.href = 'index.html';
    });

    loadQueries();
</script>
</body>
</html>
