<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-t="soil_health">Krishi Mitra - Soil Health</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #f0f2f5; }
        .sidebar { height: 100vh; background: #1a531b; color: white; position: fixed; width: 250px; }
        .sidebar a { color: #cfdfcf; text-decoration: none; padding: 15px 20px; display: block; }
        .sidebar a:hover, .sidebar a.active { background: #2e7d32; color: white; }
        .main-content { margin-left: 250px; padding: 30px; }
        .lang-switch { position: absolute; top: 20px; right: 20px; z-index: 1000; }
        @media (max-width: 768px) {
            .sidebar { width: 100%; height: auto; position: relative; }
            .main-content { margin-left: 0; }
        }
    </style>
</head>
<body>

<div class="lang-switch">
    <button class="btn btn-outline-success btn-sm" onclick="toggleLanguage()">
        <i class="bi bi-translate"></i> <span id="langToggleText">हिंदी</span>
    </button>
</div>

<div class="sidebar">
    <div class="p-4 text-center">
        <h3 class="fw-bold"><i class="bi bi-leaf"></i> <span data-t="brand">Krishi Mitra</span></h3>
    </div>
    <nav>
        <a href="farmer_dashboard.html"><i class="bi bi-speedometer2 me-2"></i> <span data-t="dashboard">Dashboard</span></a>
        <a href="advisory.html"><i class="bi bi-lightbulb me-2"></i> <span data-t="crop_advisory">Crop Advisory</span></a>
        <a href="soil_health.html" class="active"><i class="bi bi-moisture me-2"></i> <span data-t="soil_health">Soil Health</span></a>
        <a href="pest_disease.html"><i class="bi bi-bug me-2"></i> <span data-t="pest_disease">Pest & Disease</span></a>
        <a href="market_prices.html"><i class="bi bi-graph-up-arrow me-2"></i> <span data-t="market_prices_nav">Market Prices</span></a>
        <a href="knowledge_base.html"><i class="bi bi-book me-2"></i> <span data-t="knowledge_base">Knowledge Base</span></a>
        <a href="queries.html"><i class="bi bi-question-circle me-2"></i> <span data-t="my_queries">My Queries</span></a>
        <a href="#" id="logoutBtn" class="mt-5 text-danger"><i class="bi bi-box-arrow-right me-2"></i> <span data-t="logout">Logout</span></a>
    </nav>
</div>

<div class="main-content">
    <h2 class="mb-4" data-t="soil_health_title">Soil Health Monitoring</h2>
    <div class="row">
        <div class="col-md-5">
            <div class="card p-4 border-0 shadow-sm rounded-4">
                <h5 data-t="test_soil">Input Soil Test Results</h5>
                <form id="soilForm">
                    <div class="mb-3">
                        <label class="form-label">pH Level</label>
                        <input type="number" step="0.1" class="form-control" id="pH" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" data-t="nitrogen">Nitrogen (N) - mg/kg</label>
                        <input type="number" class="form-control" id="nitrogen" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" data-t="phosphorus">Phosphorus (P) - mg/kg</label>
                        <input type="number" class="form-control" id="phosphorus" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label" data-t="potassium">Potassium (K) - mg/kg</label>
                        <input type="number" class="form-control" id="potassium" required>
                    </div>
                    <button type="submit" class="btn btn-success w-100" data-t="test_soil">Analyze Soil</button>
                </form>
            </div>
        </div>
        <div class="col-md-7">
            <div class="card p-4 border-0 shadow-sm rounded-4 bg-white">
                <h5 data-t="analysis_result">Analysis & Suggestions</h5>
                <div id="soilResult" class="mt-3" style="display: none;">
                    <div class="alert alert-info" id="suggestionText"></div>
                    <canvas id="soilChart" style="max-height: 300px;"></canvas>
                </div>
                <div id="soilPlaceholder" class="text-muted mt-5 text-center">
                    <i class="bi bi-clipboard-data fs-1"></i>
                    <p data-t="enter_details_prompt">Submit your soil test data to see analysis.</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="translations.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    function toggleLanguage() {
        const currentLang = localStorage.getItem('krishi_mitra_lang') || 'en';
        setLanguage(currentLang === 'en' ? 'hi' : 'en');
    }

    const user = JSON.parse(localStorage.getItem('user'));
    if (!user || user.role !== 'farmer') window.location.href = 'index.html';

    document.getElementById('soilForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = {
            farmer_id: user.id,
            pH: document.getElementById('pH').value,
            nitrogen: document.getElementById('nitrogen').value,
            phosphorus: document.getElementById('phosphorus').value,
            potassium: document.getElementById('potassium').value
        };

        try {
            const response = await fetch('http://localhost:5000/api/soil/test', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });
            const data = await response.json();
            
            document.getElementById('soilPlaceholder').style.display = 'none';
            document.getElementById('soilResult').style.display = 'block';
            document.getElementById('suggestionText').innerText = data.suggestion;
            
            // Simple Chart
            const ctx = document.getElementById('soilChart').getContext('2d');
            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Nitrogen', 'Phosphorus', 'Potassium'],
                    datasets: [{
                        label: 'Soil Nutrients',
                        data: [formData.nitrogen, formData.phosphorus, formData.potassium],
                        backgroundColor: ['#28a745', '#ffc107', '#17a2b8']
                    }]
                },
                options: {
                    scales: { y: { beginAtZero: true } }
                }
            });
        } catch (err) {
            console.error(err);
        }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.clear();
        window.location.href = 'index.html';
    });
</script>
</body>
</html>
