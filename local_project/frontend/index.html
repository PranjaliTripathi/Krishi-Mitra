<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-t="brand">Krishi Mitra - Smart Farmer Advisory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #f8f9fa; }
        .login-container { max-width: 450px; margin-top: 80px; }
        .card { border: none; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn-primary { background-color: #28a745; border: none; }
        .btn-primary:hover { background-color: #218838; }
        .brand-logo { color: #28a745; font-size: 2.5rem; font-weight: bold; }
        .error-msg { color: #dc3545; font-size: 0.85rem; margin-top: 0.25rem; display: none; }
        .lang-switch { position: absolute; top: 20px; right: 20px; }
    </style>
</head>
<body>

<div class="lang-switch">
    <button class="btn btn-outline-success btn-sm" onclick="toggleLanguage()">
        <i class="bi bi-translate"></i> <span id="langToggleText">हिंदी</span>
    </button>
</div>

<div class="container login-container">
    <div class="text-center mb-4">
        <div class="brand-logo"><i class="bi bi-leaf"></i> <span data-t="brand">Krishi Mitra</span></div>
        <p class="text-muted" data-t="brand">Smart Farmer Advisory System</p>
    </div>
    <div class="card p-4">
        <h4 class="text-center mb-4 fw-bold" data-t="login_title">Farmer Login</h4>
        <form id="loginForm" novalidate>
            <div class="mb-4">
                <label class="form-label fw-medium" data-t="email_mobile_label">Email or Mobile</label>
                <input type="text" class="form-control form-control-lg" id="email_mobile" required placeholder="Enter email or mobile">
                <div class="error-msg" id="email_mobile_error"></div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-medium" data-t="password_label">Password</label>
                <div class="input-group input-group-lg">
                    <input type="password" class="form-control border-end-0" id="password" required placeholder="Enter password">
                    <button class="btn btn-outline-secondary border-start-0 bg-white" type="button" id="togglePassword">
                        <i class="bi bi-eye"></i>
                    </button>
                </div>
                <div class="error-msg" id="password_error"></div>
            </div>
            <div class="mb-4 text-end">
                <a href="forgot_password.html" class="text-success text-decoration-none small fw-medium" data-t="forgot_password_link">Forgot Password?</a>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold shadow-sm" data-t="login_btn">Login</button>
        </form>
        <div class="text-center mt-4">
            <p class="mb-2"><span data-t="new_farmer_link">New farmer? Register here</span> <a href="register.html" class="text-success fw-bold text-decoration-none" data-t="register_btn">Register here</a></p>
            <hr class="my-4 opacity-10">
            <p><a href="admin_login.html" class="text-muted small text-decoration-none" data-t="admin_login_title">Admin Login</a></p>
        </div>
    </div>
</div>

<script src="translations.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function toggleLanguage() {
        const currentLang = localStorage.getItem('krishi_mitra_lang') || 'en';
        setLanguage(currentLang === 'en' ? 'hi' : 'en');
    }

    // Toggle Password Visibility
    document.getElementById('togglePassword').addEventListener('click', function() {
        const passwordInput = document.getElementById('password');
        const icon = this.querySelector('i');
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            icon.classList.replace('bi-eye', 'bi-eye-slash');
        } else {
            passwordInput.type = 'password';
            icon.classList.replace('bi-eye-slash', 'bi-eye');
        }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        // Reset errors
        document.querySelectorAll('.error-msg').forEach(el => el.style.display = 'none');
        
        const email_mobile = document.getElementById('email_mobile').value;
        const password = document.getElementById('password').value;
        const lang = localStorage.getItem('krishi_mitra_lang') || 'en';
        const t = translations[lang];

        let hasError = false;
        if (!email_mobile) {
            const err = document.getElementById('email_mobile_error');
            err.innerText = t.all_fields_required;
            err.style.display = 'block';
            hasError = true;
        }
        if (!password) {
            const err = document.getElementById('password_error');
            err.innerText = t.all_fields_required;
            err.style.display = 'block';
            hasError = true;
        }

        if (hasError) return;

        try {
            const response = await fetch('http://localhost:5000/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email_mobile, password })
            });
            const data = await response.json();
            if (response.ok) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                if (data.user.role === 'admin') {
                    window.location.href = 'admin_dashboard.html';
                } else {
                    window.location.href = 'farmer_dashboard.html';
                }
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'Oops...',
                    text: t.invalid_credentials || data.error,
                    confirmButtonColor: '#28a745'
                });
            }
        } catch (err) {
            console.error(err);
            Swal.fire({
                icon: 'error',
                title: 'Error',
                text: 'Something went wrong! Make sure backend is running on port 5000.',
                confirmButtonColor: '#28a745'
            });
        }
    });
</script>
</body>
</html>
