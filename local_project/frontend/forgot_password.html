<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-t="forgot_password_title">Krishi Mitra - Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #f8f9fa; }
        .forgot-container { max-width: 450px; margin-top: 80px; }
        .card { border: none; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn-success { background-color: #28a745; border: none; }
        .lang-switch { position: absolute; top: 20px; right: 20px; }
    </style>
</head>
<body>

<div class="lang-switch">
    <button class="btn btn-outline-success btn-sm" onclick="toggleLanguage()">
        <i class="bi bi-translate"></i> <span id="langToggleText">हिंदी</span>
    </button>
</div>

<div class="container forgot-container">
    <div class="text-center mb-4">
        <h2 class="text-success fw-bold"><i class="bi bi-key"></i> <span data-t="forgot_password_title">Forgot Password</span></h2>
        <p class="text-muted" data-t="brand">Recover your Krishi Mitra account</p>
    </div>
    
    <div class="card p-4">
        <!-- Step 1: Enter Email/Mobile -->
        <div id="step1">
            <div class="mb-3">
                <label class="form-label" data-t="email_mobile_label">Enter Email or Mobile</label>
                <input type="text" class="form-control" id="email_mobile" required>
            </div>
            <button class="btn btn-success w-100 mb-3" id="checkUserBtn" data-t="submit">Continue</button>
            <div class="text-center">
                <a href="index.html" class="text-muted small" data-t="back_to_login">Back to Login</a>
            </div>
        </div>

        <!-- Step 2: Choose Method -->
        <div id="step2" style="display: none;">
            <h5 class="mb-3" data-t="forgot_password_title">Choose Recovery Method</h5>
            <div class="d-grid gap-2">
                <button class="btn btn-outline-success" id="methodSecurityBtn">Option A: Security Question</button>
                <button class="btn btn-outline-primary" id="methodAdminBtn" onclick="alert('Admin request coming soon')">Option B: Request to Admin</button>
            </div>
            <button class="btn btn-link text-muted mt-3 w-100" onclick="location.reload()" data-t="back_to_login">Back</button>
        </div>

        <!-- Step 3A: Security Question -->
        <div id="step3A" style="display: none;">
            <h5 class="mb-3" data-t="security_question_label">Security Verification</h5>
            <p id="displayQuestion" class="fw-bold text-muted"></p>
            <div class="mb-3">
                <label class="form-label" data-t="security_answer_label">Your Answer</label>
                <input type="text" class="form-control" id="security_answer" required>
            </div>
            <div class="mb-3">
                <label class="form-label" data-t="password_label">New Password</label>
                <input type="password" class="form-control" id="new_password" required>
            </div>
            <button class="btn btn-success w-100" id="resetPasswordBtn" data-t="submit">Reset Password</button>
            <button class="btn btn-link text-muted mt-2 w-100" onclick="location.reload()" data-t="back_to_login">Cancel</button>
        </div>
    </div>
</div>

<script src="translations.js"></script>
<script>
    function toggleLanguage() {
        const currentLang = localStorage.getItem('krishi_mitra_lang') || 'en';
        setLanguage(currentLang === 'en' ? 'hi' : 'en');
    }

    let userEmailMobile = '';

    document.getElementById('checkUserBtn').addEventListener('click', async () => {
        userEmailMobile = document.getElementById('email_mobile').value;
        const lang = localStorage.getItem('krishi_mitra_lang') || 'en';
        const t = translations[lang];

        if (!userEmailMobile) return Swal.fire({ icon: 'warning', text: t.all_fields_required });

        try {
            const response = await fetch('http://localhost:5000/api/auth/forgot-password/check', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email_mobile: userEmailMobile })
            });
            const data = await response.json();
            if (response.ok) {
                document.getElementById('step1').style.display = 'none';
                document.getElementById('step2').style.display = 'block';
                document.getElementById('displayQuestion').innerText = data.security_question;
            } else {
                Swal.fire({ icon: 'error', text: data.error });
            }
        } catch (err) {
            console.error(err);
        }
    });

    document.getElementById('methodSecurityBtn').addEventListener('click', () => {
        document.getElementById('step2').style.display = 'none';
        document.getElementById('step3A').style.display = 'block';
    });

    document.getElementById('resetPasswordBtn').addEventListener('click', async () => {
        const security_answer = document.getElementById('security_answer').value;
        const new_password = document.getElementById('new_password').value;
        const lang = localStorage.getItem('krishi_mitra_lang') || 'en';
        const t = translations[lang];

        if (!security_answer || !new_password) return Swal.fire({ icon: 'warning', text: t.all_fields_required });

        try {
            const response = await fetch('http://localhost:5000/api/auth/forgot-password/verify', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    email_mobile: userEmailMobile, 
                    security_answer, 
                    new_password 
                })
            });
            const data = await response.json();
            if (response.ok) {
                Swal.fire({
                    icon: 'success',
                    title: 'Success',
                    text: t.password_reset_success,
                    confirmButtonColor: '#28a745'
                }).then(() => {
                    window.location.href = 'index.html';
                });
            } else {
                Swal.fire({ icon: 'error', text: data.error });
            }
        } catch (err) {
            console.error(err);
        }
    });
</script>
</body>
</html>
